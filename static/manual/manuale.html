M.de = {
  title: 'Benutzerhandbuch', sub: 'PolGraph OSINT · grafische Erkundung von OSINT-Daten für Ermittlungsfälle',
  toc: 'Inhalt', shortcuts: 'Maus- und Tastaturkürzel',
  kbdHead: ['Aktion', 'Wirkung'],
  kbd: [
    ['Klick auf einen Knoten', 'Erweitert den Knoten (zeigt seine Verbindungen); ein zweiter Klick klappt ihn ein'],
    ['Rechtsklick auf einen Knoten', 'Öffnet die Knotenkarte'],
    ['Rechtsklick auf eine Verbindung', 'Öffnet das Fenster zum Bearbeiten der Verbindung'],
    ['Rechtsklick auf den Hintergrund', 'Kontextmenü mit „Neuer Knoten“'],
    ['Strg+Klick (oder ⌘+Klick) auf einen Knoten', 'Nimmt den Knoten in die Auswahl auf oder entfernt ihn'],
    ['Strg+Ziehen auf dem Hintergrund', 'Auswahlrahmen: die umschlossenen Knoten kommen zur Auswahl hinzu'],
    ['Alt+Klick auf einen Social-Knoten', 'Öffnet das Profil (Nebenfenster, Hintergrund-Tab oder Kopie des Links, je nach Wahl im Panel)'],
    ['H+Klick auf einen Knoten', 'Hebt den Knoten und seine Verbindungen hervor und blendet den Rest ab; erneut zum Aufheben'],
    ['N+Klick auf einen Knoten', 'Blendet den Knoten aus (nur Anzeige, die Daten bleiben)'],
    ['Mausrad / Ziehen', 'Zoom und Verschieben des Graphen'],
    ['Esc', 'Schließt das offene Fenster'],
    ['Eingabe im Namensfeld einer Verbindung', 'Speichert'],
    ['Titelleiste eines Fensters', 'Ziehen, um das Fenster zu verschieben; Doppelklick zentriert es wieder'],
  ],
  sections: [
   { id: 'intro', h: '1. Was PolGraph OSINT ist', body: `
<p>PolGraph OSINT stellt die Informationen eines Ermittlungsfalls als <b>Graph</b> dar: Personen, Telefone, E-Mails, Social-Media-Profile, Fahrzeuge, Orte, Dokumente und die Verbindungen zwischen ihnen. Jedes Element ist ein <b>Knoten</b>, jede Beziehung eine <b>Verbindung</b>. Das Programm läuft auf Ihrem Rechner: Die Daten verlassen den PC nie, abgesehen vom optionalen KI-Dienst, den Sie selbst konfigurieren.</p>
<p>Gestartet wird es per Doppelklick auf die ausführbare Datei (oder aus dem Quellcode mit <code>python app.py</code>): Ein kleiner lokaler Server startet und der Browser öffnet <code>http://127.0.0.1:5000</code>. Das Konsolenfenster zeigt die Meldungen des Programms und dient zum Beenden (<kbd>Strg</kbd>+<kbd>C</kbd> oder Schließen des Fensters). Der Port lässt sich mit der Umgebungsvariablen <code>PORT</code> ändern.</p>
<div class="note">Das Programm ist freie Software (GNU GPL v3 mit Namensnennungspflicht). Die Lizenzen des Programms und aller Komponenten sind über den Link <b>Lizenzen</b> im linken Panel einsehbar.</div>` },
   { id: 'cases', h: '2. Fälle: erster Start und Verwaltung', body: `
<p>Die gesamte Arbeit ist in <b>Fällen</b> organisiert. Jeder Fall ist ein eigenes Archiv mit eigenen Knoten, Verbindungen, Notizen, Ansichten und importierten Dateien. Beim ersten Start gibt es keinen Fall: Das Programm bittet sofort, einen anzulegen, und solange kein Fall offen ist, lassen sich weder Knoten hinzufügen noch Daten importieren.</p>
${fig(IMG.first, 'Erster Start: kein Fall offen, das Fenster „Neuer Fall“ öffnet sich von selbst.')}
<p>Im Kasten <b>Fall</b> oben im Panel:</p>
<ul>
<li>die <b>Auswahlliste</b> zeigt den offenen Fall; die Wahl eines anderen lädt die Seite mit dessen Daten neu;</li>
<li><b>Neu</b> legt einen leeren Fall an und öffnet ihn; <b>Bearbeiten</b> ändert Name und Beschreibung;</li>
<li><b>Zusammenführen</b> erzeugt einen neuen Fall mit dem Inhalt von zwei oder mehr Fällen: gleiche Knoten (dieselbe Person, dasselbe Telefon …) werden zu einem, abweichende Daten bleiben als getrennte Karten desselben Knotens; wahlweise werden die Ursprungsfälle gelöscht;</li>
<li><b>Löschen</b> entfernt den Fall mit seinem gesamten Inhalt. Das lässt sich nicht rückgängig machen: War es der letzte Fall, kehrt das Programm in den Anfangszustand ohne Fälle zurück.</li>
</ul>
${fig(IMG.caseEdit, 'Bearbeiten von Name und Beschreibung des Falls.')}` },
   { id: 'interface', h: '3. Die Oberfläche', body: `
<p>Links das <b>Bedienpanel</b>, rechts der <b>Graph</b> auf weißem Hintergrund. Das Panel scrollt senkrecht und enthält von oben nach unten: Logo und Credits, den Fall, die Suche, die Hauptschaltflächen, die künstliche Intelligenz, gespeicherte Ansichten, Dokumentquellen, Kategoriefilter, Optionen für Verbindungen und Layout, Export, Auswahl, Legende und Statuszeile.</p>
${fig(IMG.over, 'Überblick: Panel links, Graph rechts. Der goldene Knoten ist die Zielperson, die roten gestrichelten Linien sind angepasste Verbindungen.')}
<div class="two">
${fig(IMG.sideTop, 'Oberer Teil des Panels.', 'narrow')}
${fig(IMG.sideBottom, 'Unterer Teil des Panels: Layout, Export, Auswahl, Legende.', 'narrow')}
</div>
<p>Knoten haben je Typ ein Symbol und eine Farbe (Person, Telefon, E-Mail, Social mit dem Logo der Plattform, Fahrzeug, Ort, Link, Text, Foto). Die <b>Zielperson</b> ist größer, mit goldenem Rand und Namen. Knoten aus den Ausgangsdaten haben einen roten Rand. Ein erweiterter Knoten hat einen doppelten Rand.</p>` },
   { id: 'search', h: '4. Suchen und Knoten in den Graphen holen', body: `
<p>Geben Sie mindestens drei Zeichen in <b>Knoten suchen</b> ein: Die Liste zeigt die Knoten, die den Text im Namen, in Aliasnamen, Notizen und Kartenwerten enthalten. Ein Klick auf ein Ergebnis holt den Knoten in den Graphen und zentriert ihn. <b>Alle Ergebnisse hinzufügen</b> holt sie alle zusammen; <b>Alle Zielpersonen laden</b> fügt die Zielpersonen des Falls hinzu.</p>
${fig(IMG.search, 'Suchergebnisse mit Knotentyp und Häkchen bei den bereits im Graphen vorhandenen.')}
<p>Mit der <b>unscharfen Suche</b> werden auch ähnliche Schreibweisen gefunden (Tippfehler, andere Transliterationen); die Stufe von 1 bis 6 gibt an, wie viele Abweichungen toleriert werden. <b>Graph leeren</b> entfernt alle Knoten aus der Ansicht, ohne etwas zu löschen.</p>` },
   { id: 'graph', h: '5. Im Graphen bewegen', body: `
<p>Ziehen Sie den Hintergrund zum Verschieben und nutzen Sie das Mausrad zum Zoomen. <b>Anpassen</b> holt alles ins Fenster zurück. Ein <b>Klick auf einen Knoten</b> erweitert ihn und zeigt die verbundenen Knoten bis zur in <b>Tiefe</b> gewählten Stufe (1 = nur direkte Nachbarn); ein <b>zweiter Klick</b> klappt ihn ein und blendet die Nachbarn aus, die seinetwegen sichtbar waren (die mit anderen erweiterten oder ausgewählten Knoten verbundenen bleiben). <b>Alle erweitern</b> und <b>Einklappen</b> wirken auf alle sichtbaren Knoten.</p>
<p>Der <b>Rechtsklick</b> auf einen Knoten öffnet seine Karte; auf eine Verbindung das Verbindungsfenster; auf den Hintergrund ein Menü mit <b>Neuer Knoten</b>.</p>
${fig(IMG.ctx, 'Rechtsklick auf den Hintergrund: Kontextmenü.')}
<p>Mit <kbd>Strg</kbd>+Klick (oder <kbd>Strg</kbd>+Ziehen eines Rahmens) baut man eine <b>Auswahl</b> von Knoten auf, die im Kasten <b>Auswahl</b> aufgelistet ist: Von dort werden alle Pfade zwischen den gewählten Knoten hervorgehoben (bis zu einer Höchstzahl von Schritten) und Verbindungen zwischen ihnen erstellt. <kbd>H</kbd>+Klick hebt einen Knoten und seine Verbindungen hervor und blendet den Rest ab; <kbd>N</kbd>+Klick blendet einen Knoten aus (die Schaltfläche <b>Ausgeblendete anzeigen</b> holt sie zurück). <kbd>Alt</kbd>+Klick auf ein Social-Profil öffnet es im Browser gemäß der Wahl unter <b>Alt+Klick auf soziale Netzwerke</b>.</p>
<p><b>Knoten anzeigen mit</b> filtert den Graphen nach der Mindestzahl an Verbindungen: nützlich, um die am stärksten vernetzten Knoten hervortreten zu lassen.</p>` },
   { id: 'card', h: '6. Die Knotenkarte', body: `
<p>Die Karte (Rechtsklick auf den Knoten) versammelt alles, was über diesen Knoten bekannt ist: die <b>Notiz</b> des Benutzers, die nach Kategorien gruppierte <b>Übersicht der Verbindungen</b> (Social nach Plattform, dann Telefone, E-Mails, Orte, Fahrzeuge …), die <b>Karten</b> mit Rohdaten und Bildern. Jeder Wert wird mit einem Klick in die Zwischenablage kopiert; die Namen verbundener Knoten sind anklickbar und führen zum Knoten.</p>
${fig(IMG.card, 'Karte der Zielperson mit Notiz, Verbindungsübersicht und Schaltflächen unten.')}
<p>Die Schaltflächen unten: <b>Zweig erweitern / Einklappen</b>, <b>Im Graphen zentrieren</b>, <b>In Quellen suchen</b> (die Begriffe der Karte in den indizierten Dokumenten), <b>Hinzufügen</b> (ein neuer, mit diesem verbundener Knoten), <b>Mit KI importieren</b> (von der KI ausgewerteter Freitext), <b>Umbenennen</b>, <b>Werte bearbeiten</b>, <b>Notiz</b>, <b>PDF</b> (die druckbare Karte) und <b>Knoten löschen</b>. Ein gelöschter Datenknoten landet unter <b>Gelöschte Knoten</b>, von wo er wiederhergestellt werden kann; ein von Hand erstellter Knoten wird wirklich gelöscht.</p>` },
   { id: 'add', h: '7. Einen Knoten hinzufügen', body: `
<p><b>Neuer Knoten</b> im Panel (oder im Rechtsklick-Menü des Hintergrunds) erstellt einen eigenständigen Knoten; <b>Hinzufügen</b> in der Karte eines Knotens erstellt einen bereits mit ihm verbundenen Knoten. Man wählt den <b>Typ</b> und füllt seine Felder aus: Profil-URL für soziale Netzwerke (die Plattform wird an der Adresse erkannt), Nummer, E-Mail, Benutzername, Nachname, Vorname und Geburtsdatum für Personen, Stadt, Adresse, Hausnummer und Koordinaten für Orte, Kennzeichen und Farbe für Fahrzeuge, Titel und Text für Notizen, Bild für Fotos sowie die Ermittlungsobjekte (Waffen, Betäubungsmittel, Dokumente …).</p>
${fig(IMG.add, 'Neuer Knoten, verbunden mit einer Zielperson: Typ, Wert, Zielperson-Häkchen, Verbindungseigenschaften und Vorschau.')}
<p>Jeder Knoten kann mit dem Häkchen <b>Als Zielperson markieren</b> hervorgehoben werden. Entsteht der Knoten verbunden mit einem anderen, stehen unten die <b>Verbindungseigenschaften</b>: Name, Linienform, Linienart, Stärke und Farbe. Die <b>Pfeile</b> werden direkt in der <b>Vorschau</b> gesetzt: Ein Klick neben einen Knoten setzt oder entfernt die Pfeilspitze zu diesem Knoten (beim Überfahren erscheint die Spitze halbtransparent).</p>
<p>Die Schaltfläche <b>✨ KI</b> oben im Fenster wechselt in den Freitextmodus: Fügen Sie einen Text ein (Protokoll, Hinweis, Nachricht), und die KI schlägt Personen, Telefone, E-Mails, Profile, Orte und Fahrzeuge mit ihren Beziehungen vor; vor dem Anlegen prüfen Sie sie in einer Vorschau.</p>` },
   { id: 'links', h: '8. Verbindungen', body: `
<p>Um vorhandene Knoten zu verbinden: mit <kbd>Strg</kbd>+Klick auswählen und <b>Ausgewählte Knoten verbinden</b> drücken. Bei zwei Knoten wählt man die Richtung (die Schaltfläche ⇄ tauscht sie); bei mehreren wird jedes Paar verbunden. Zwischen zwei Knoten können mehrere Verbindungen bestehen, jede mit eigenem Namen.</p>
${fig(IMG.link, 'Knoten verbinden: Name, Form, Linie, Stärke, Farbe und Pfeile aus der Vorschau (hier in beide Richtungen).')}
<p>Der <b>Rechtsklick auf eine Verbindung</b> öffnet ihr Fenster: Name und Aussehen ändern, Pfeile umkehren, zu den anderen Verbindungen zwischen denselben Knoten wechseln, eine weitere anlegen und von Hand erstellte Verbindungen löschen. Bei Verbindungen aus den Daten ändert sich nur das Aussehen; <b>Standardstil</b> stellt es wieder her.</p>
${fig(IMG.edge, 'Bearbeiten einer Verbindung: roter gestrichelter Bogen mit Pfeilen in beide Richtungen.')}
<p>Im Panel wendet <b>Stil der Verbindungen</b> Form, Linienart und Stärke auf <b>alle</b> Verbindungen des Graphen gleichzeitig an; es ist eine Anzeigeeinstellung, die die Daten nicht verändert und mit „wie festgelegt“ zurückgenommen wird.</p>` },
   { id: 'edit', h: '9. Werte eines Knotens bearbeiten', body: `
<p>Aus der Karte öffnet <b>Werte bearbeiten</b> alle Daten des Knotens: Beschriftung, URL (geöffnet mit Alt+Klick), Notiz, das Häkchen <b>Als Zielperson markieren</b> und die Felder jeder Karte. Werte werden geändert oder mit ✕ als gelöscht markiert; freie Felder können hinzugefügt werden. Änderungen berühren die Quelldateien nie: Sie bleiben im Fall und werden sofort angewendet. <b>Alle Änderungen verwerfen</b> setzt den Knoten auf die Originaldaten zurück.</p>
${fig(IMG.edit, 'Werte bearbeiten: allgemeine Felder, Zielperson-Häkchen und Kartenfelder (auch die aus einer CSV importierten).')}` },
   { id: 'import', h: '10. Aus CSV oder Excel importieren', body: `
<p><b>CSV/Excel importieren</b> erstellt viele Knoten und Verbindungen auf einmal, in drei Schritten. Die Datei hat eine Zeile je Verbindung: Knoten 1, Verbindung, Knoten 2; ohne Knoten 2 entsteht ein einzelner Knoten.</p>
${fig(IMG.imp1, 'Schritt 1: die Datei. „Beispieldatei herunterladen“ erzeugt eine vorausgefüllte Vorlage.')}
<p>In <b>Schritt 2</b> erscheint jede Spalte der Datei mit einigen Beispielwerten und einer Auswahl <b>Importieren als</b>. Spalten mit erkannten Überschriften sind bereits zugeordnet; die übrigen werden als <b>Zusatzfeld von Knoten 1</b> vorgeschlagen, sodass sie unter dem Spaltennamen in der Karte des Knotens landen und kein Wert verloren geht. Man kann einen Standardtyp für Knoten ohne Typspalte, einen Standardnamen für die Verbindung und angeben, ob die erste Zeile die Überschriften enthält.</p>
${fig(IMG.imp2, 'Schritt 2: Zuordnung der Spalten.')}
<p><b>Schritt 3</b> zeigt Zeile für Zeile, was angelegt wird: neue Knoten, bereits vorhandene (kursiv), Verbindungen und etwaige Fehler. Zeilen lassen sich einzeln ausschließen; dann <b>Importieren</b>.</p>
${fig(IMG.imp3, 'Schritt 3: Vorschau und Import.')}
<h3>Erkannte Überschriften</h3>
<table>
<tr><th>Angabe</th><th>Überschriften (Englisch / Italienisch), mit 1 oder 2 für die Seite</th></tr>
<tr><td>Name oder Wert des Knotens</td><td>name, name1, name2, nome, value, valore, from/to, da/a</td></tr>
<tr><td>Typ</td><td>type, tipo (person, phone, email, username, social oder direkt instagram/facebook/…, link, place, vehicle, text, target)</td></tr>
<tr><td>Weitere Knotenangaben</td><td>label, url, platform, text, surname, birthdate, color (Fahrzeug), target (ja/nein), address, housenumber, lat, lon, note</td></tr>
<tr><td>Verbindung</td><td>relation, arrow (-> &lt;- &lt;-&gt;), shape (straight, curve, segments, right angle, wedge), color, line (solid, dashed, dotted), width</td></tr>
</table>
<div class="note warn">Eine Person wird durch <b>Name und Geburtsdatum zusammen</b> identifiziert: Steht das Datum nur in einigen Zeilen, werden „Rossi Mario (12/03/1980)“ und „Rossi Mario“ zu zwei verschiedenen, durch eine gestrichelte Linie verbundenen Knoten. Wiederholen Sie das Datum in jeder Zeile derselben Person. Zwei vollständige Beispieldateien liegen im Ordner <code>esempi</code> des Programms.</div>` },
   { id: 'filters', h: '11. Kategorien, Layout und Aussehen', body: `
<p>Die Schaltflächen <b>Kategorien</b> schalten ganze Knotenkategorien aus und ein (Telefone, Social, Orte …), jede in der Kategoriefarbe mit ihrer Anzahl; <b>Alle ausblenden / Alle anzeigen</b> wirkt auf alle. Eine ausdrückliche Aktion (Erweitern, Hinzufügen) macht die betroffenen Knoten trotzdem wieder sichtbar.</p>
<p><b>Layout</b>: <b>Organisch</b> ordnet die Knoten kraftbasiert an (verbundene nah beieinander), <b>Kreisförmig</b> im Kreis, <b>Hierarchisch</b> als Baum, <b>Raster</b> in Zeilen und Spalten; <b>Kreuzungen verringern</b> ordnet den aktuellen Graphen neu, um Kreuzungen zu reduzieren. Das Erweitern eines Knotens platziert nur die neuen Knoten ringförmig um ihn, ohne die anderen oder die Kamera zu bewegen.</p>
<p><b>Kennungen</b> zeigt oder verbirgt die Kennungsknoten (Telefone, E-Mails, Benutzernamen), die als Brücken zwischen Personen dienen. Die <b>Legende</b> unten im Panel zeigt die Farben der vorhandenen Kategorien.</p>` },
   { id: 'views', h: '12. Gespeicherte Ansichten', body: `
<p>Eine <b>Ansicht</b> ist eine Momentaufnahme des Graphen: sichtbare und erweiterte Knoten, Positionen, Zoom und Auswahl. Geben Sie einen Namen ein und drücken Sie <b>Ansicht speichern</b>; die Liste zeigt die Ansichten des Falls, <b>Öffnen</b> stellt eine wieder her und 🗑 löscht sie. Ansichten helfen, einen Gedankengang wieder aufzunehmen oder den Bildschirm für den Export vorzubereiten.</p>` },
   { id: 'sources', h: '13. Dokumentquellen und OCR', body: `
<p>Legen Sie die Dokumente (PDF, Word, Excel, CSV, Text, Bilder) in den Ordner <code>fonti</code> neben dem Programm und drücken Sie <b>Scannen</b>: Ihr Inhalt wird im Programm indiziert. Von da an findet <b>In Quellen suchen</b>, im Panel oder in der Karte eines Knotens, in welchen Dokumenten ein Begriff oder die Werte des Knotens (Nummern, Namen, E-Mails) vorkommen, mit Kontextausschnitt und Link zum Öffnen der Datei.</p>
<p><b>Bilder</b> (Fotos von Dokumenten, Screenshots) werden mit der <b>OCR</b> von Tesseract gelesen. Meldet die Statuszeile „OCR nicht verfügbar“, genügt unter Windows die Schaltfläche <b>Tesseract herunterladen (OCR)</b>: Das Programm lädt den offiziellen Installer (ca. 50 MB), entpackt ihn in den Ordner <code>tools/tesseract</code> neben dem Programm und aktiviert die OCR ohne Neustart. Unter Linux und Mac installieren Sie Tesseract über die Paketverwaltung.</p>` },
   { id: 'ai', h: '14. Künstliche Intelligenz', body: `
<p>Das Programm kann einen <b>Chatbot</b> (Ollama-kompatibler Server oder einer mit OpenAI-API, lokal oder entfernt) für zwei Dinge nutzen: <b>Knoten aus Freitext erstellen</b> und Namen aus anderen Alphabeten in lateinische Zeichen <b>transliterieren</b>. Die KI ist optional: Ist der Schalter <b>KI aktiv</b> aus, verbindet sich das Programm mit nichts und nutzt nur die lokale Transliteration.</p>
${fig(IMG.ai, 'KI-Konfiguration: Endpunkt, Schlüssel, Modell, API-Format, Zeitlimit und automatische Transliteration.')}
<p><b>Konfigurieren</b> öffnet die Einstellungen: Serveradresse, API-Schlüssel (gespeichert in der Datei <code>chatbot.conf</code> neben dem Programm, niemals veröffentlichen), Modell, Anfrageformat, maximale Wartezeit, Kopfzeile und Präfix des Schlüssels. <b>Verbindung testen</b> prüft, ob der Server antwortet. Die Schaltfläche <b>Mit KI transliterieren</b> erscheint im Panel, wenn es Wörter zu transliterieren gibt.</p>
<div class="note warn">Die im KI-Modus eingefügten Texte und die zu transliterierenden Namen werden an den konfigurierten Server gesendet. Verwenden Sie einen vertrauenswürdigen oder lokalen Server, wenn die Daten vertraulich sind.</div>` },
   { id: 'manual', h: '15. Manuelle Änderungen und gelöschte Knoten', body: `
<p><b>Manuelle Änderungen</b> listet alles auf, was im Fall von Hand erstellt oder geändert wurde: hinzugefügte Knoten (auch aus Dateien importierte oder von der KI vorgeschlagene), erstellte Verbindungen und umbenannte Beschriftungen, mit Namensfilter. Von hier löscht man, was nicht mehr gebraucht wird. <b>Gelöschte Knoten</b> listet die aus dem Graphen entfernten Datenknoten auf und erlaubt, sie einzeln oder alle zusammen wiederherzustellen.</p>
${fig(IMG.manual, 'Manuelle Änderungen: von Hand hinzugefügte Knoten mit Datum und Verbindungen.')}` },
   { id: 'export', h: '16. Exportieren', body: `
<p><b>Graph als PDF</b> druckt den Graphen wie am Bildschirm, mit Legende und Fallkopf. <b>Tabellenblatt</b> erzeugt ein Dokument mit allen sichtbaren Knoten und ihren Daten als Tabelle, bereit zum Drucken oder zum Speichern als PDF aus dem Browser. Aus der Karte eines Knotens exportiert <b>PDF</b> nur diese Karte. Die Beispiel-CSV wird im Importfenster heruntergeladen.</p>` },
   { id: 'lang', h: '17. Sprachen, Lizenzen und Credits', body: `
<p>Die Sprache der Oberfläche wird in der Liste neben dem Logo gewählt (Italienisch, Englisch, Französisch, Deutsch, Spanisch, Arabisch mit Text von rechts nach links); die Dateninhalte werden nicht übersetzt. Unter dem Logo stehen die Credits des Autors und der Link <b>Lizenzen</b>, der das Programm und alle Drittkomponenten mit den vollständigen Lizenztexten auflistet.</p>
${fig(IMG.lic, 'Lizenzfenster: links die Komponenten, rechts der Text.')}` },
   { id: 'files', h: '18. Daten, Ordner und Dateien', body: `
<table>
<tr><th>Ordner / Datei</th><th>Inhalt</th></tr>
<tr><td><code>data/</code></td><td>Alle Daten: das allgemeine Archiv (Fälle, Transliterationswörterbuch, Quellenindex) und der Ordner <code>cases</code> mit einer Datenbank je Fall. Bewahren Sie eine Kopie als Sicherung auf.</td></tr>
<tr><td><code>data/media/</code></td><td>In Fotoknoten hochgeladene Bilder.</td></tr>
<tr><td><code>fonti/</code></td><td>Die für die Quellensuche zu indizierenden Dokumente.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>KI-Konfiguration mit dem Serverschlüssel: nicht weitergeben. <code>chatbot.conf.example</code> ist die leere Vorlage.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Vom Programm heruntergeladenes Tesseract OCR.</td></tr>
<tr><td><code>esempi/</code></td><td>Beispiel-CSV-Dateien für den Import.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>Programmlizenz, Zusatzbedingungen und Lizenzen der Komponenten.</td></tr>
</table>
<p>Das Programm ist portabel: Der Ordner kann mit allen Daten auf einen anderen PC kopiert werden. Für eine Sicherung genügt es, den Ordner <code>data</code> (und bei Bedarf <code>fonti</code>) zu kopieren.</p>` },
  ]
};

M.es = {
  title: 'Manual de uso', sub: 'PolGraph OSINT · exploración gráfica de datos OSINT para casos de investigación',
  toc: 'Índice', shortcuts: 'Atajos de ratón y teclado',
  kbdHead: ['Acción', 'Efecto'],
  kbd: [
    ['Clic en un nodo', 'Expande el nodo (muestra sus conexiones); un segundo clic lo contrae'],

    ['Rueda del ratón / arrastrar', 'Zoom y desplazamiento del grafo'],
    ['Esc', 'Cierra la ventana abierta'],
    ['Intro en el campo nombre de una conexión', 'Guarda'],
    ['Barra de título de una ventana', 'Arrástrala para mover la ventana; doble clic para volver a centrarla'],
  ],
  sections: [
   { id: 'intro', h: '1. Qué es PolGraph OSINT', body: `
<p>PolGraph OSINT representa como <b>grafo</b> la información de un caso de investigación: personas, teléfonos, correos, perfiles sociales, vehículos, lugares, documentos y las conexiones entre ellos. Cada elemento es un <b>nodo</b>, cada relación una <b>conexión</b>. El programa se ejecuta en tu ordenador: los datos nunca salen del PC, salvo por el servicio opcional de inteligencia artificial que configures tú mismo.</p>
<p>Se inicia con doble clic en el ejecutable (o, desde el código fuente, con <code>python app.py</code>): arranca un pequeño servidor local y el navegador se abre en <code>http://127.0.0.1:5000</code>. La ventana de consola muestra los mensajes del programa y sirve para detenerlo (<kbd>Ctrl</kbd>+<kbd>C</kbd> o cerrando la ventana). El puerto se cambia con la variable de entorno <code>PORT</code>.</p>
<div class="note">El programa es software libre (GNU GPL v3 con obligación de atribución). Las licencias del programa y de todos sus componentes se leen desde el enlace <b>Licencias</b> del panel izquierdo.</div>` },
   { id: 'cases', h: '2. Casos: primer inicio y gestión', body: `
<p>Todo el trabajo se organiza en <b>casos</b>. Cada caso es un archivo separado con sus propios nodos, conexiones, notas, vistas y archivos importados. En el primer inicio no existe ningún caso: el programa pide enseguida crear uno, y mientras no haya un caso abierto no se pueden añadir nodos ni importar datos.</p>
${fig(IMG.first, 'Primer inicio: ningún caso abierto, la ventana «Nuevo caso» se abre sola.')}
<p>En el recuadro <b>Caso</b>, arriba en el panel:</p>
<ul>
<li>el <b>desplegable</b> muestra el caso abierto; al elegir otro la página se recarga con sus datos;</li>
<li><b>Nuevo</b> crea un caso vacío y lo abre; <b>Modificar</b> cambia nombre y descripción;</li>
<li><b>Unir</b> crea un nuevo caso con el contenido de dos o más casos: los nodos iguales (misma persona, mismo teléfono…) se convierten en uno y los datos distintos quedan como fichas separadas del mismo nodo; opcionalmente se eliminan los casos originales;</li>
<li><b>Eliminar</b> borra el caso con todo su contenido. No se puede deshacer: si era el último caso se vuelve al estado inicial sin casos.</li>
</ul>
${fig(IMG.caseEdit, 'Modificación del nombre y la descripción del caso.')}` },
   { id: 'interface', h: '3. La interfaz', body: `
<p>A la izquierda el <b>panel de mandos</b>, a la derecha el <b>grafo</b> sobre fondo blanco. El panel se desplaza verticalmente y contiene, de arriba abajo: logotipo y créditos, el caso, la búsqueda, los botones principales, la inteligencia artificial, las vistas guardadas, las fuentes documentales, los filtros por categoría, las opciones de conexiones y disposición, la exportación, la selección, la leyenda y la línea de estado.</p>
${fig(IMG.over, 'Vista general: panel a la izquierda, grafo a la derecha. El nodo dorado es el objetivo, las líneas rojas discontinuas son conexiones personalizadas.')}
<div class="two">
${fig(IMG.sideTop, 'Parte alta del panel.', 'narrow')}
${fig(IMG.sideBottom, 'Parte baja del panel: disposición, exportación, selección, leyenda.', 'narrow')}
</div>
<p>Los nodos tienen un icono y un color por tipo (persona, teléfono, correo, social con el logotipo de la plataforma, vehículo, lugar, enlace, texto, foto). El <b>objetivo</b> es más grande, con borde y nombre dorados. Los nodos procedentes de los datos de partida tienen borde rojo. Un nodo expandido tiene borde doble.</p>` },
   { id: 'search', h: '4. Buscar y llevar nodos al grafo', body: `
<p>Escribe al menos tres caracteres en <b>Buscar nodo</b>: la lista muestra los nodos que contienen el texto en el nombre, los alias, las notas y los valores de las fichas. Un clic en un resultado lleva el nodo al grafo y lo centra. <b>Añadir todos los resultados</b> los lleva todos a la vez; <b>Cargar todos los objetivos</b> añade los objetivos del caso.</p>
${fig(IMG.search, 'Resultados de la búsqueda con el tipo del nodo y una marca para los que ya están en el grafo.')}
<p>Con la <b>búsqueda aproximada</b> se encuentran también grafías cercanas (erratas, transliteraciones distintas); el nivel de 1 a 6 indica cuántas diferencias tolerar. <b>Vaciar grafo</b> quita todos los nodos de la vista sin borrar nada.</p>` },
   { id: 'graph', h: '5. Moverse por el grafo', body: `
<p>Arrastra el fondo para desplazarte y usa la rueda para hacer zoom. <b>Ajustar</b> devuelve todo a la ventana. Un <b>clic en un nodo</b> lo expande, mostrando los nodos conectados hasta la profundidad elegida en <b>Prof.</b> (1 = solo vecinos directos); un <b>segundo clic</b> lo contrae, ocultando los vecinos que se veían gracias a él (quedan los conectados a otros nodos expandidos o seleccionados). <b>Expandir todo</b> y <b>Contraer</b> actúan sobre todos los nodos visibles.</p>
<p>El <b>clic derecho</b> en un nodo abre su ficha; en una conexión abre la ventana de la conexión; en el fondo abre un menú con <b>Nuevo nodo</b>.</p>
${fig(IMG.ctx, 'Clic derecho en el fondo: menú contextual.')}
<p>Con <kbd>Ctrl</kbd>+clic (o <kbd>Ctrl</kbd>+arrastrando un recuadro) se construye una <b>selección</b> de nodos, listada en el recuadro <b>Selección</b>: desde ahí se resaltan todos los caminos entre los nodos elegidos (dentro de un número máximo de saltos) y se crean conexiones entre ellos. <kbd>H</kbd>+clic resalta un nodo y sus conexiones atenuando el resto; <kbd>N</kbd>+clic oculta un nodo (el botón <b>Mostrar ocultos</b> los hace reaparecer). <kbd>Alt</kbd>+clic en un perfil social lo abre en el navegador según la opción de <b>Alt+clic en redes sociales</b>.</p>
<p><b>Mostrar nodos con</b> filtra el grafo por número mínimo de conexiones: útil para hacer emerger los nodos más conectados.</p>` },
   { id: 'card', h: '6. La ficha del nodo', body: `
<p>La ficha (clic derecho en el nodo) reúne todo lo que se sabe de ese nodo: la <b>nota</b> del usuario, el <b>resumen de conexiones</b> agrupadas por categoría (redes sociales por plataforma, luego teléfonos, correos, lugares, vehículos…), las <b>fichas</b> con los datos en bruto y las imágenes. Cada valor se copia al portapapeles con un clic; los nombres de los nodos conectados son pulsables y llevan al nodo.</p>
${fig(IMG.card, 'Ficha del objetivo con nota, resumen de conexiones y botones abajo.')}
<p>Los botones de abajo: <b>Expandir rama / Contraer</b>, <b>Centrar en el grafo</b>, <b>Buscar en las fuentes</b> (los términos de la ficha en los documentos indexados), <b>Añadir</b> (un nuevo nodo conectado a este), <b>Importar con IA</b> (texto libre interpretado por la IA), <b>Renombrar</b>, <b>Modificar valores</b>, <b>Nota</b>, <b>PDF</b> (la ficha imprimible) y <b>Eliminar nodo</b>. Un nodo de los datos eliminado pasa a <b>Nodos eliminados</b>, desde donde se puede restaurar; un nodo creado a mano se borra de verdad.</p>` },
   { id: 'add', h: '7. Añadir un nodo', body: `
<p><b>Nuevo nodo</b> en el panel (o en el menú del clic derecho sobre el fondo) crea un nodo independiente; <b>Añadir</b> en la ficha de un nodo crea un nodo ya conectado a él. Se elige el <b>tipo</b> y se rellenan sus campos: URL del perfil para redes sociales (la plataforma se reconoce por la dirección), número, correo, nombre de usuario, apellido, nombre y fecha de nacimiento para las personas, ciudad, dirección, número y coordenadas para los lugares, matrícula y color para los vehículos, título y texto para las notas, imagen para las fotos, más los elementos de investigación (armas, estupefacientes, documentos…).</p>
${fig(IMG.add, 'Nuevo nodo conectado a un objetivo: tipo, valor, casilla objetivo, propiedades de la conexión y vista previa.')}
<p>Cualquier nodo puede resaltarse como <b>objetivo</b> con la casilla <b>Marcar como objetivo</b>. Si el nodo nace conectado a otro, abajo están las <b>propiedades de la conexión</b>: nombre, forma de la línea, tipo de línea, grosor y color. Las <b>flechas</b> se ajustan directamente en la <b>vista previa</b>: un clic junto a un nodo pone o quita la punta de flecha hacia ese nodo (al pasar el ratón aparece la punta translúcida).</p>
<p>El botón <b>✨ IA</b> arriba en la ventana pasa al modo de texto libre: pegas un texto (un acta, un aviso, un mensaje) y la IA propone personas, teléfonos, correos, perfiles, lugares y vehículos con sus relaciones; antes de crearlos se revisan en una vista previa.</p>` },
   { id: 'links', h: '8. Conexiones', body: `
<p>Para conectar nodos ya presentes: selecciónalos con <kbd>Ctrl</kbd>+clic y pulsa <b>Conectar los nodos seleccionados</b>. Con dos nodos se elige el sentido (el botón ⇄ los intercambia); con más nodos se conectan todas las parejas. Entre dos nodos pueden existir varias conexiones, cada una con su nombre.</p>
${fig(IMG.link, 'Conectar nodos: nombre, forma, línea, grosor, color y flechas desde la vista previa (aquí en ambos sentidos).')}
<p>El <b>clic derecho en una conexión</b> abre su ventana: se modifican nombre y aspecto, se invierten las flechas, se pasa a las otras conexiones entre los mismos nodos, se crea otra y, para las creadas a mano, se elimina. En las conexiones que vienen de los datos solo cambia el aspecto; <b>Estilo predeterminado</b> lo restablece.</p>
${fig(IMG.edge, 'Modificación de una conexión: arco curvo rojo discontinuo con flechas en ambos sentidos.')}
<p>En el panel, <b>Estilo de las conexiones</b> aplica forma, tipo de línea y grosor a <b>todas</b> las conexiones del grafo a la vez; es una preferencia de visualización que no modifica los datos y se anula eligiendo «como están».</p>` },
   { id: 'edit', h: '9. Modificar los valores de un nodo', body: `
<p>Desde la ficha, <b>Modificar valores</b> abre todos los datos del nodo: etiqueta, URL (se abre con Alt+clic), nota, la casilla <b>Marcar como objetivo</b> y los campos de cada ficha. Los valores se cambian o se marcan como eliminados con ✕; se pueden añadir campos libres. Las modificaciones nunca tocan los archivos de origen: quedan en el caso y se aplican al vuelo. <b>Deshacer todas las modificaciones</b> devuelve el nodo a los datos originales.</p>
${fig(IMG.edit, 'Modificar valores: campos generales, casilla objetivo y campos de la ficha (incluidos los importados de un CSV).')}` },
   { id: 'import', h: '10. Importar desde CSV o Excel', body: `
<p><b>Importar CSV/Excel</b> crea muchos nodos y conexiones de una vez, en tres pasos. El archivo tiene una fila por conexión: nodo 1, conexión, nodo 2; sin nodo 2 se crea un nodo aislado.</p>
${fig(IMG.imp1, 'Paso 1: el archivo. «Descargar un archivo de ejemplo» produce una plantilla ya rellena.')}
<p>En el <b>paso 2</b> cada columna del archivo aparece con algunos valores de ejemplo y un desplegable <b>Importar como</b>. Las columnas con encabezados reconocidos ya están asignadas; las demás se proponen como <b>campo adicional del nodo 1</b>, de modo que van a la ficha del nodo con el nombre de la columna y no se pierde ningún valor. Se puede indicar un tipo predeterminado para los nodos sin columna de tipo, un nombre predeterminado para la conexión y si la primera fila contiene los encabezados.</p>
${fig(IMG.imp2, 'Paso 2: asignación de las columnas.')}
<p>El <b>paso 3</b> muestra lo que se creará fila por fila: nodos nuevos, nodos ya presentes (en cursiva), conexiones y posibles errores. Las filas se pueden excluir una a una; después <b>Importar</b>.</p>
${fig(IMG.imp3, 'Paso 3: vista previa e importación.')}
<h3>Encabezados reconocidos</h3>
<table>
<tr><th>Dato</th><th>Encabezados (inglés / italiano), con 1 o 2 para el lado</th></tr>
<tr><td>Nombre o valor del nodo</td><td>name, name1, name2, nome, value, valore, from/to, da/a</td></tr>
<tr><td>Tipo</td><td>type, tipo (person, phone, email, username, social o directamente instagram/facebook/…, link, place, vehicle, text, target)</td></tr>
<tr><td>Otros datos del nodo</td><td>label, url, platform, text, surname, birthdate, color (vehículo), target (sí/no), address, housenumber, lat, lon, note</td></tr>
<tr><td>Conexión</td><td>relation, arrow (-> &lt;- &lt;-&gt;), shape (straight, curve, segments, right angle, wedge), color, line (solid, dashed, dotted), width</td></tr>
</table>
<div class="note warn">Una persona se identifica por <b>nombre y fecha de nacimiento juntos</b>: si la fecha aparece solo en algunas filas, «Rossi Mario (12/03/1980)» y «Rossi Mario» se convierten en dos nodos distintos unidos por una línea discontinua. Repite la fecha en cada fila de la misma persona. Dos archivos de ejemplo completos están en la carpeta <code>esempi</code> del programa.</div>` },
   { id: 'filters', h: '11. Categorías, disposición y aspecto', body: `
<p>Los botones <b>Categorías</b> apagan o encienden categorías enteras de nodos (teléfonos, redes sociales, lugares…), cada uno con el color de la categoría y su recuento; <b>Ocultar todo / Mostrar todo</b> actúa sobre todas. Una acción explícita (expansión, adición) vuelve a hacer visibles de todos modos los nodos implicados.</p>
<p><b>Disposición</b>: <b>Orgánica</b> coloca los nodos por fuerzas (los conectados cerca), <b>Circular</b> en círculo, <b>Jerárquica</b> en árbol, <b>Rejilla</b> en filas y columnas; <b>Reducir cruces</b> reordena el grafo actual para disminuir los cruces. La expansión de un nodo coloca solo los nodos nuevos en corona a su alrededor, sin mover los demás ni la cámara.</p>
<p><b>Identificadores</b> muestra u oculta los nodos identificativos (teléfonos, correos, nombres de usuario) usados como puente entre personas. La <b>leyenda</b> al final del panel recoge los colores de las categorías presentes.</p>` },
   { id: 'views', h: '12. Vistas guardadas', body: `
<p>Una <b>vista</b> es la fotografía del grafo tal como está: nodos visibles y expandidos, posiciones, zoom y selección. Escribe un nombre y pulsa <b>Guardar vista</b>; el desplegable lista las vistas del caso, <b>Abrir</b> la restaura y 🗑 la elimina. Las vistas sirven para retomar un razonamiento o preparar la pantalla que se va a exportar.</p>` },
   { id: 'sources', h: '13. Fuentes documentales y OCR', body: `
<p>Pon los documentos (PDF, Word, Excel, CSV, texto, imágenes) en la carpeta <code>fonti</code> junto al programa y pulsa <b>Escanear</b>: su contenido se indexa en el programa. Desde entonces <b>Buscar en las fuentes</b>, en el panel o en la ficha de un nodo, encuentra en qué documentos aparecen un término o los valores del nodo (números, nombres, correos), con el fragmento de contexto y el enlace para abrir el archivo.</p>
<p>Las <b>imágenes</b> (fotos de documentos, capturas) se leen con el <b>OCR</b> de Tesseract. Si la línea de estado dice «OCR no disponible», en Windows basta el botón <b>Descargar Tesseract (OCR)</b>: el programa descarga el instalador oficial (unos 50 MB), lo extrae en la carpeta <code>tools/tesseract</code> junto al programa y activa el OCR sin reiniciar. En Linux y Mac se instala Tesseract desde el gestor de paquetes.</p>` },
   { id: 'ai', h: '14. Inteligencia artificial', body: `
<p>El programa puede usar un <b>chatbot</b> (un servidor compatible con Ollama o con API de OpenAI, local o remoto) para dos cosas: <b>crear nodos a partir de texto libre</b> y <b>transliterar</b> a caracteres latinos los nombres escritos en otros alfabetos. La IA es opcional: con el interruptor <b>IA activa</b> apagado el programa no se conecta a nada y usa solo la transliteración local.</p>
${fig(IMG.ai, 'Configuración de la IA: endpoint, clave, modelo, formato de API, tiempo de espera y transliteración automática.')}
<p><b>Configurar</b> abre los ajustes: dirección del servidor, clave API (guardada en el archivo <code>chatbot.conf</code> junto al programa, nunca lo publiques), modelo, formato de las peticiones, tiempo máximo de espera, cabecera y prefijo de la clave. <b>Probar conexión</b> comprueba que el servidor responde. El botón <b>Transliterar con IA</b> aparece en el panel cuando hay palabras que transliterar.</p>
<div class="note warn">Los textos que pegas en el modo IA y los nombres por transliterar se envían al servidor que hayas configurado. Usa un servidor de confianza, o uno local, si los datos son reservados.</div>` },
   { id: 'manual', h: '15. Modificaciones manuales y nodos eliminados', body: `
<p><b>Modificaciones manuales</b> lista todo lo creado o cambiado a mano en el caso: nodos añadidos (también los importados de archivos o propuestos por la IA), conexiones creadas y etiquetas renombradas, con un filtro por nombre. Desde aquí se elimina lo que ya no sirve. <b>Nodos eliminados</b> lista los nodos de los datos quitados del grafo y permite restaurarlos uno a uno o todos juntos.</p>
${fig(IMG.manual, 'Modificaciones manuales: nodos añadidos a mano con fecha y conexiones.')}` },
   { id: 'export', h: '16. Exportar', body: `
<p><b>Grafo en PDF</b> imprime el grafo tal como está en pantalla, con leyenda y encabezado del caso. <b>Ficha tabular</b> produce un documento con todos los nodos visibles y sus datos, en tabla, listo para imprimir o guardar en PDF desde el navegador. Desde la ficha de un nodo, <b>PDF</b> exporta solo esa ficha. El CSV de ejemplo se descarga desde la ventana de importación.</p>` },
   { id: 'lang', h: '17. Idiomas, licencias y créditos', body: `
<p>El idioma de la interfaz se elige en el desplegable junto al logotipo (italiano, inglés, francés, alemán, español, árabe con texto de derecha a izquierda); el contenido de los datos no se traduce. Bajo el logotipo están los créditos del autor y el enlace <b>Licencias</b>, que lista el programa y todos los componentes de terceros con los textos completos de las licencias.</p>
${fig(IMG.lic, 'Ventana de licencias: a la izquierda los componentes, a la derecha el texto.')}` },
   { id: 'files', h: '18. Datos, carpetas y archivos', body: `
<table>
<tr><th>Carpeta / archivo</th><th>Contenido</th></tr>
<tr><td><code>data/</code></td><td>Todos los datos: el archivo general (casos, diccionario de transliteración, índice de fuentes) y la carpeta <code>cases</code> con una base de datos por caso. Guarda una copia como respaldo.</td></tr>
<tr><td><code>data/media/</code></td><td>Las imágenes cargadas en los nodos foto.</td></tr>
<tr><td><code>fonti/</code></td><td>Los documentos que indexar para la búsqueda en las fuentes.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>Configuración de la IA con la clave del servidor: no debe compartirse. <code>chatbot.conf.example</code> es la plantilla vacía.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Tesseract OCR descargado por el programa.</td></tr>
<tr><td><code>esempi/</code></td><td>Archivos CSV de ejemplo para la importación.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>Licencia del programa, términos adicionales y licencias de los componentes.</td></tr>
</table>
<p>El programa es portable: la carpeta se puede copiar a otro PC con todos los datos. Para el respaldo basta copiar la carpeta <code>data</code> (y <code>fonti</code>, si hace falta).</p>` },
  ]
};

  sections: [
   { id: 'intro', h: '1. ما هو PolGraph OSINT', body: `
<p>يمثّل PolGraph OSINT معلومات القضية التحقيقية على شكل <b>رسم بياني</b>: أشخاص وهواتف وبريد إلكتروني وحسابات اجتماعية ومركبات وأماكن ووثائق والروابط بينها. كل عنصر <b>عقدة</b>، وكل علاقة <b>رابط</b>. يعمل البرنامج على حاسوبك: لا تغادر البيانات الجهاز أبداً، باستثناء خدمة الذكاء الاصطناعي الاختيارية التي تضبطها بنفسك.</p>
<p>يُشغَّل بنقرة مزدوجة على الملف التنفيذي (أو من الشيفرة المصدرية بالأمر <code>python app.py</code>): يبدأ خادم محلي صغير ويُفتح المتصفح على <code>http://127.0.0.1:5000</code>. تعرض نافذة الطرفية رسائل البرنامج وتُستخدم لإيقافه (<kbd>Ctrl</kbd>+<kbd>C</kbd> أو إغلاق النافذة). يُغيَّر المنفذ بمتغير البيئة <code>PORT</code>.</p>
<div class="note">البرنامج برمجية حرة (GNU GPL v3 مع وجوب الإسناد). يمكن قراءة تراخيص البرنامج وكل مكوّناته من رابط <b>التراخيص</b> في اللوحة اليسرى.</div>` },
   { id: 'cases', h: '2. القضايا: التشغيل الأول والإدارة', body: `
<p>كل العمل منظّم في <b>قضايا</b>. كل قضية أرشيف منفصل له عقده وروابطه وملاحظاته وطرق عرضه وملفاته المستوردة. عند التشغيل الأول لا توجد أي قضية: يطلب البرنامج فوراً إنشاء واحدة، وما دامت لا توجد قضية مفتوحة لا يمكن إضافة عقد ولا استيراد بيانات.</p>
${fig(IMG.first, 'التشغيل الأول: لا قضية مفتوحة، ونافذة «قضية جديدة» تُفتح تلقائياً.')}
<p>في مربع <b>القضية</b> أعلى اللوحة:</p>
<ul>
<li>تعرض <b>القائمة المنسدلة</b> القضية المفتوحة؛ اختيار أخرى يعيد تحميل الصفحة ببياناتها؛</li>
<li><b>جديد</b> ينشئ قضية فارغة ويفتحها؛ <b>تعديل</b> يغيّر الاسم والوصف؛</li>
<li><b>دمج</b> ينشئ قضية جديدة بمحتوى قضيتين أو أكثر: العقد المتطابقة (الشخص نفسه، الهاتف نفسه…) تصبح واحدة، والبيانات المختلفة تبقى بطاقات منفصلة للعقدة نفسها؛ ويمكن اختيار حذف القضايا الأصلية؛</li>
<li><b>حذف</b> يمسح القضية بكل محتواها. لا يمكن التراجع عن ذلك: إن كانت آخر قضية يعود البرنامج إلى الحالة الأولى بلا قضايا.</li>
</ul>
${fig(IMG.caseEdit, 'تعديل اسم القضية ووصفها.')}` },
   { id: 'interface', h: '3. الواجهة', body: `
<p>على اليسار <b>لوحة الأوامر</b>، وعلى اليمين <b>الرسم البياني</b> على خلفية بيضاء. تُمرَّر اللوحة عمودياً وتحتوي من الأعلى: الشعار والاعتمادات، القضية، البحث، الأزرار الرئيسية، الذكاء الاصطناعي، طرق العرض المحفوظة، المصادر الوثائقية، مرشّحات الفئات، خيارات الروابط والتخطيط، التصدير، التحديد، المفتاح، وسطر الحالة.</p>
${fig(IMG.over, 'نظرة عامة: اللوحة على اليسار والرسم على اليمين. العقدة الذهبية هي الهدف، والخطوط الحمراء المتقطعة روابط مخصّصة.')}
<div class="two">
${fig(IMG.sideTop, 'الجزء العلوي من اللوحة.', 'narrow')}
${fig(IMG.sideBottom, 'الجزء السفلي من اللوحة: التخطيط، التصدير، التحديد، المفتاح.', 'narrow')}
</div>
<p>لكل نوع من العقد أيقونة ولون (شخص، هاتف، بريد، حساب اجتماعي بشعار المنصة، مركبة، مكان، رابط، نص، صورة). <b>الهدف</b> أكبر حجماً وبإطار واسم ذهبيين. العقد الآتية من بيانات البداية لها إطار أحمر. العقدة الموسّعة لها إطار مزدوج.</p>` },
   { id: 'search', h: '4. البحث وجلب العقد إلى الرسم', body: `
<p>اكتب ثلاثة أحرف على الأقل في <b>ابحث عن عقدة</b>: تعرض القائمة العقد التي تحتوي النص في الاسم أو الأسماء البديلة أو الملاحظات أو قيم البطاقات. النقر على نتيجة يجلب العقدة إلى الرسم ويضعها في الوسط. <b>إضافة كل النتائج</b> يجلبها دفعة واحدة؛ <b>تحميل كل الأهداف</b> يضيف أهداف القضية.</p>
${fig(IMG.search, 'نتائج البحث مع نوع العقدة وعلامة للعقد الموجودة في الرسم.')}
<p>مع <b>البحث التقريبي</b> تُعثر أيضاً على الكتابات القريبة (أخطاء إملائية، نقحرات مختلفة)؛ يحدد المستوى من 1 إلى 6 عدد الاختلافات المقبولة. <b>تفريغ الرسم</b> يزيل كل العقد من العرض دون حذف شيء.</p>` },
   { id: 'graph', h: '5. التنقل في الرسم', body: `
<p>اسحب الخلفية للتحريك واستخدم العجلة للتكبير. <b>ملاءمة</b> يعيد كل شيء إلى النافذة. <b>نقرة على عقدة</b> توسّعها فتظهر العقد المتصلة ضمن العمق المختار في <b>العمق</b> (1 = الجيران المباشرون فقط)؛ <b>النقرة الثانية</b> تطويها وتخفي الجيران الذين ظهروا بسببها (يبقى المتصلون بعقد أخرى موسّعة أو محدّدة). <b>توسيع الكل</b> و<b>طي</b> يعملان على كل العقد الظاهرة.</p>
<p><b>النقرة اليمنى</b> على عقدة تفتح بطاقتها؛ وعلى رابط تفتح نافذة الرابط؛ وعلى الخلفية تفتح قائمة فيها <b>عقدة جديدة</b>.</p>
${fig(IMG.ctx, 'نقرة يمنى على الخلفية: القائمة السياقية.')}
<p>بـ <kbd>Ctrl</kbd>+نقرة (أو <kbd>Ctrl</kbd>+سحب مستطيل) تبني <b>تحديداً</b> من العقد يظهر في مربع <b>التحديد</b>: ومنه تُبرز كل المسارات بين العقد المختارة (ضمن حد أقصى من القفزات) وتنشئ روابط بينها. <kbd>H</kbd>+نقرة تُبرز عقدة وروابطها وتخفّف الباقي؛ <kbd>N</kbd>+نقرة تخفي عقدة (زر <b>إظهار المخفية</b> يعيدها). <kbd>Alt</kbd>+نقرة على حساب اجتماعي تفتحه في المتصفح حسب الخيار في <b>Alt+نقرة على الشبكات الاجتماعية</b>.</p>
<p><b>إظهار العقد التي لها</b> يرشّح الرسم حسب الحد الأدنى لعدد الروابط: مفيد لإبراز العقد الأكثر اتصالاً.</p>` },
   { id: 'card', h: '6. بطاقة العقدة', body: `
<p>تجمع البطاقة (نقرة يمنى على العقدة) كل ما يُعرف عن تلك العقدة: <b>ملاحظة</b> المستخدم، و<b>ملخص الروابط</b> مجمّعة حسب الفئة (الشبكات الاجتماعية حسب المنصة، ثم الهواتف والبريد والأماكن والمركبات…)، و<b>البطاقات</b> بالبيانات الخام والصور. تُنسخ كل قيمة إلى الحافظة بنقرة؛ وأسماء العقد المتصلة قابلة للنقر وتقود إلى العقدة.</p>
${fig(IMG.card, 'بطاقة الهدف مع الملاحظة وملخص الروابط والأزرار في الأسفل.')}
<p>الأزرار في الأسفل: <b>توسيع الفرع / طي</b>، <b>توسيط في الرسم</b>، <b>البحث في المصادر</b> (مصطلحات البطاقة في الوثائق المفهرسة)، <b>إضافة</b> (عقدة جديدة متصلة بهذه)، <b>استيراد بالذكاء الاصطناعي</b> (نص حر يفسّره الذكاء الاصطناعي)، <b>إعادة تسمية</b>، <b>تعديل القيم</b>، <b>ملاحظة</b>، <b>PDF</b> (البطاقة القابلة للطباعة) و<b>حذف العقدة</b>. العقدة المحذوفة من البيانات تنتقل إلى <b>العقد المحذوفة</b> ويمكن استعادتها؛ أما العقدة المنشأة يدوياً فتُحذف فعلاً.</p>` },
   { id: 'add', h: '7. إضافة عقدة', body: `
<p><b>عقدة جديدة</b> في اللوحة (أو في قائمة النقرة اليمنى على الخلفية) تنشئ عقدة مستقلة؛ و<b>إضافة</b> في بطاقة عقدة تنشئ عقدة متصلة بها مسبقاً. يُختار <b>النوع</b> وتُملأ حقوله: رابط الحساب للشبكات الاجتماعية (تُعرف المنصة من العنوان)، الرقم، البريد، اسم المستخدم، اسم العائلة والاسم وتاريخ الميلاد للأشخاص، المدينة والعنوان ورقم المبنى والإحداثيات للأماكن، اللوحة واللون للمركبات، العنوان والنص للملاحظات، الصورة للصور، إضافة إلى عناصر التحقيق (أسلحة، مخدرات، وثائق…).</p>
${fig(IMG.add, 'عقدة جديدة متصلة بهدف: النوع، القيمة، خانة الهدف، خصائص الرابط والمعاينة.')}
<p>يمكن تمييز أي عقدة <b>هدفاً</b> بخانة <b>تمييز كهدف</b>. إن وُلدت العقدة متصلة بأخرى، ففي الأسفل <b>خصائص الرابط</b>: الاسم وشكل الخط ونوعه والسماكة واللون. تُضبط <b>الأسهم</b> مباشرة على <b>المعاينة</b>: نقرة بجوار عقدة تضيف رأس السهم نحو تلك العقدة أو تزيله (يظهر الرأس شفافاً عند التمرير).</p>
<p>زر <b>✨ الذكاء الاصطناعي</b> أعلى النافذة ينتقل إلى وضع النص الحر: الصق نصاً (محضراً، بلاغاً، رسالة) فيقترح الذكاء الاصطناعي أشخاصاً وهواتف وبريداً وحسابات وأماكن ومركبات مع علاقاتها؛ وتراجعها في معاينة قبل إنشائها.</p>` },
   { id: 'links', h: '8. الروابط', body: `
<p>لربط عقد موجودة: حدّدها بـ <kbd>Ctrl</kbd>+نقرة واضغط <b>ربط العقد المحددة</b>. مع عقدتين تختار الاتجاه (زر ⇄ يبدّلهما)؛ ومع أكثر تُربط كل الأزواج. يمكن أن توجد عدة روابط بين عقدتين، لكل منها اسمه.</p>
${fig(IMG.link, 'ربط العقد: الاسم والشكل والخط والسماكة واللون والأسهم من المعاينة (هنا في الاتجاهين).')}
<p><b>النقرة اليمنى على رابط</b> تفتح نافذته: تعديل الاسم والمظهر، عكس الأسهم، الانتقال إلى الروابط الأخرى بين العقدتين نفسيهما، إنشاء رابط آخر، وحذف الروابط المنشأة يدوياً. أما الروابط الآتية من البيانات فيتغير مظهرها فقط؛ و<b>النمط الافتراضي</b> يعيده.</p>
${fig(IMG.edge, 'تعديل رابط: قوس منحنٍ أحمر متقطع بأسهم في الاتجاهين.')}
<p>في اللوحة، يطبّق <b>نمط الروابط</b> الشكل ونوع الخط والسماكة على <b>كل</b> روابط الرسم معاً؛ وهو تفضيل عرض لا يغيّر البيانات ويُلغى باختيار «كما هي مضبوطة».</p>` },
   { id: 'edit', h: '9. تعديل قيم عقدة', body: `
<p>من البطاقة، يفتح <b>تعديل القيم</b> كل بيانات العقدة: التسمية، الرابط (يُفتح بـ Alt+نقرة)، الملاحظة، خانة <b>تمييز كهدف</b> وحقول كل بطاقة. تُغيَّر القيم أو تُعلَّم محذوفة بـ ✕؛ ويمكن إضافة حقول حرة. لا تمسّ التعديلات ملفات المصدر أبداً: تبقى في القضية وتُطبَّق فوراً. <b>التراجع عن كل التعديلات</b> يعيد العقدة إلى بياناتها الأصلية.</p>
${fig(IMG.edit, 'تعديل القيم: الحقول العامة وخانة الهدف وحقول البطاقة (بما فيها المستوردة من CSV).')}` },
   { id: 'import', h: '10. الاستيراد من CSV أو Excel', body: `
<p><b>استيراد CSV/Excel</b> ينشئ عقداً وروابط كثيرة دفعة واحدة، في ثلاث خطوات. في الملف صف لكل رابط: العقدة 1، الرابط، العقدة 2؛ ومن دون عقدة 2 تُنشأ عقدة منفردة.</p>
${fig(IMG.imp1, 'الخطوة 1: الملف. «تنزيل ملف نموذجي» ينتج قالباً معبّأً.')}
<p>في <b>الخطوة 2</b> يظهر كل عمود من الملف مع بعض القيم النموذجية وقائمة <b>استيراد كـ</b>. الأعمدة ذات العناوين المعروفة مُسندة مسبقاً؛ والأخرى تُقترح <b>حقلاً إضافياً للعقدة 1</b> فتُحفظ في بطاقة العقدة باسم العمود ولا تضيع أي قيمة. يمكن تحديد نوع افتراضي للعقد بلا عمود نوع، واسم افتراضي للرابط، وما إذا كان الصف الأول يحتوي العناوين.</p>
${fig(IMG.imp2, 'الخطوة 2: مطابقة الأعمدة.')}
<p>تعرض <b>الخطوة 3</b> ما سيُنشأ صفاً صفاً: عقد جديدة، عقد موجودة (بخط مائل)، روابط وأخطاء إن وُجدت. يمكن استثناء الصفوف واحداً واحداً؛ ثم <b>استيراد</b>.</p>
${fig(IMG.imp3, 'الخطوة 3: المعاينة والاستيراد.')}
<h3>العناوين المعروفة</h3>
<table>
<tr><th>البيان</th><th>العناوين (إنجليزية / إيطالية) مع 1 أو 2 للجهة</th></tr>
<tr><td>اسم العقدة أو قيمتها</td><td>name, name1, name2, nome, value, valore, from/to, da/a</td></tr>
<tr><td>النوع</td><td>type, tipo (person, phone, email, username, social أو مباشرة instagram/facebook/…, link, place, vehicle, text, target)</td></tr>
<tr><td>بيانات أخرى للعقدة</td><td>label, url, platform, text, surname, birthdate, color (مركبة), target (نعم/لا), address, housenumber, lat, lon, note</td></tr>
<tr><td>الرابط</td><td>relation, arrow (-> &lt;- &lt;-&gt;), shape (straight, curve, segments, right angle, wedge), color, line (solid, dashed, dotted), width</td></tr>
</table>
<div class="note warn">يُعرَّف الشخص بـ <b>الاسم وتاريخ الميلاد معاً</b>: إن ظهر التاريخ في بعض الصفوف فقط، يصبح «Rossi Mario (12/03/1980)» و«Rossi Mario» عقدتين مختلفتين يصلهما خط متقطع. كرّر التاريخ في كل صف للشخص نفسه. يوجد ملفان نموذجيان كاملان في مجلد <code>esempi</code> في البرنامج.</div>` },
   { id: 'filters', h: '11. الفئات والتخطيط والمظهر', body: `
<p>أزرار <b>الفئات</b> تطفئ فئات كاملة من العقد أو تشغّلها (هواتف، شبكات اجتماعية، أماكن…)، كل زر بلون فئته وعددها؛ <b>إخفاء الكل / إظهار الكل</b> يعمل على جميعها. أي إجراء صريح (توسيع، إضافة) يعيد العقد المعنية ظاهرة على أي حال.</p>
<p><b>التخطيط</b>: <b>عضوي</b> يرتب العقد بالقوى (المتصلة متقاربة)، <b>دائري</b> في دائرة، <b>هرمي</b> كشجرة، <b>شبكة</b> في صفوف وأعمدة؛ <b>تقليل التقاطعات</b> يعيد ترتيب الرسم الحالي لتقليل التقاطعات. توسيع عقدة يضع العقد الجديدة فقط في حلقة حولها دون تحريك الأخرى أو الكاميرا.</p>
<p><b>المعرّفات</b> يُظهر أو يخفي عقد التعريف (هواتف، بريد، أسماء مستخدمين) المستخدمة جسوراً بين الأشخاص. <b>المفتاح</b> أسفل اللوحة يبيّن ألوان الفئات الموجودة.</p>` },
   { id: 'views', h: '12. طرق العرض المحفوظة', body: `
<p><b>طريقة العرض</b> لقطة للرسم كما هو الآن: العقد الظاهرة والموسّعة والمواضع والتكبير والتحديد. اكتب اسماً واضغط <b>حفظ طريقة العرض</b>؛ تعرض القائمة طرق عرض القضية، <b>فتح</b> يستعيد إحداها و🗑 يحذفها. تفيد طرق العرض لاستئناف خط تفكير أو تجهيز الشاشة للتصدير.</p>` },
   { id: 'sources', h: '13. المصادر الوثائقية والتعرف الضوئي', body: `
<p>ضع الوثائق (PDF وWord وExcel وCSV ونصوص وصور) في مجلد <code>fonti</code> بجوار البرنامج واضغط <b>مسح</b>: يُفهرس محتواها داخل البرنامج. من حينها يعثر <b>البحث في المصادر</b>، في اللوحة أو في بطاقة عقدة، على الوثائق التي يظهر فيها مصطلح أو قيم العقدة (أرقام، أسماء، بريد)، مع مقتطف السياق ورابط لفتح الملف.</p>
<p>تُقرأ <b>الصور</b> (صور الوثائق، لقطات الشاشة) بواسطة <b>التعرف الضوئي</b> Tesseract. إذا ذكر سطر الحالة «التعرف الضوئي غير متاح»، يكفي في Windows زر <b>تنزيل Tesseract (OCR)</b>: ينزّل البرنامج المثبّت الرسمي (نحو 50 ميغابايت) ويستخرجه في مجلد <code>tools/tesseract</code> بجوار البرنامج ويفعّل التعرف الضوئي دون إعادة تشغيل. في Linux وMac يُثبَّت Tesseract من مدير الحزم.</p>` },
   { id: 'ai', h: '14. الذكاء الاصطناعي', body: `
<p>يمكن للبرنامج استخدام <b>روبوت محادثة</b> (خادم متوافق مع Ollama أو بواجهة OpenAI، محلي أو بعيد) لأمرين: <b>إنشاء عقد من نص حر</b> و<b>نقحرة</b> الأسماء المكتوبة بأبجديات أخرى إلى الحروف اللاتينية. الذكاء الاصطناعي اختياري: مع إطفاء مفتاح <b>الذكاء الاصطناعي مفعّل</b> لا يتصل البرنامج بشيء ويستخدم النقحرة المحلية فقط.</p>
${fig(IMG.ai, 'إعدادات الذكاء الاصطناعي: نقطة النهاية، المفتاح، النموذج، صيغة الواجهة، المهلة والنقحرة التلقائية.')}
<p><b>إعداد</b> يفتح الإعدادات: عنوان الخادم، مفتاح الواجهة (يُحفظ في ملف <code>chatbot.conf</code> بجوار البرنامج ولا يُنشر أبداً)، النموذج، صيغة الطلبات، أقصى مدة انتظار، ترويسة المفتاح وبادئته. <b>اختبار الاتصال</b> يتحقق من استجابة الخادم. يظهر زر <b>النقحرة بالذكاء الاصطناعي</b> في اللوحة عند وجود كلمات تحتاج نقحرة.</p>
<div class="note warn">النصوص التي تلصقها في وضع الذكاء الاصطناعي والأسماء المطلوب نقحرتها تُرسل إلى الخادم الذي ضبطته. استخدم خادماً موثوقاً أو محلياً إن كانت البيانات سرية.</div>` },
   { id: 'manual', h: '15. التعديلات اليدوية والعقد المحذوفة', body: `
<p>يعرض <b>التعديلات اليدوية</b> كل ما أُنشئ أو غُيّر يدوياً في القضية: العقد المضافة (بما فيها المستوردة من ملفات أو المقترحة من الذكاء الاصطناعي)، الروابط المنشأة والتسميات المعاد تسميتها، مع مرشّح بالاسم. من هنا تحذف ما لم يعد لازماً. <b>العقد المحذوفة</b> يعرض عقد البيانات المزالة من الرسم ويتيح استعادتها واحدة واحدة أو كلها معاً.</p>
${fig(IMG.manual, 'التعديلات اليدوية: عقد مضافة يدوياً مع التاريخ والروابط.')}` },
   { id: 'export', h: '16. التصدير', body: `
<p><b>الرسم إلى PDF</b> يطبع الرسم كما يظهر على الشاشة مع المفتاح وترويسة القضية. <b>ورقة جدولية</b> تنتج مستنداً بكل العقد الظاهرة وبياناتها في جدول، جاهزاً للطباعة أو الحفظ PDF من المتصفح. ومن بطاقة عقدة يصدّر <b>PDF</b> تلك البطاقة وحدها. يُنزَّل ملف CSV النموذجي من نافذة الاستيراد.</p>` },
   { id: 'lang', h: '17. اللغات والتراخيص والاعتمادات', body: `
<p>تُختار لغة الواجهة من القائمة بجوار الشعار (الإيطالية، الإنجليزية، الفرنسية، الألمانية، الإسبانية، العربية بنص من اليمين إلى اليسار)؛ ولا تُترجم محتويات البيانات. تحت الشعار اعتمادات المؤلف ورابط <b>التراخيص</b> الذي يعرض البرنامج وكل مكوّنات الطرف الثالث مع النصوص الكاملة للتراخيص.</p>
${fig(IMG.lic, 'نافذة التراخيص: المكوّنات على اليسار والنص على اليمين.')}` },
   { id: 'files', h: '18. البيانات والمجلدات والملفات', body: `
<table>
<tr><th>المجلد / الملف</th><th>المحتوى</th></tr>
<tr><td><code>data/</code></td><td>كل البيانات: الأرشيف العام (القضايا، قاموس النقحرة، فهرس المصادر) ومجلد <code>cases</code> بقاعدة بيانات لكل قضية. احتفظ بنسخة احتياطية منه.</td></tr>
<tr><td><code>data/media/</code></td><td>الصور المرفوعة في عقد الصور.</td></tr>
<tr><td><code>fonti/</code></td><td>الوثائق المراد فهرستها للبحث في المصادر.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>إعدادات الذكاء الاصطناعي مع مفتاح الخادم: لا يُشارَك. <code>chatbot.conf.example</code> هو القالب الفارغ.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Tesseract OCR الذي نزّله البرنامج.</td></tr>
<tr><td><code>esempi/</code></td><td>ملفات CSV نموذجية للاستيراد.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>ترخيص البرنامج والشروط الإضافية وتراخيص المكوّنات.</td></tr>
</table>
<p>البرنامج محمول: يمكن نسخ المجلد إلى حاسوب آخر بكل بياناته. وللنسخ الاحتياطي يكفي نسخ مجلد <code>data</code> (و<code>fonti</code> عند الحاجة).</p>` },
  ]
};

/* ------------------------------------------------------------- rendering -- */
const LANGS = [['it', 'Italiano'], ['pl', 'Polski'], ['en', 'English'], ['fr', 'Français'], ['de', 'Deutsch'], ['es', 'Español'], ['ar', 'العربية']];
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && M[q]) return q;
  try { const s = localStorage.getItem('manualLang'); if (s && M[s]) return s; } catch (_) {}
  const nav = (navigator.language || 'it').slice(0, 2).toLowerCase();
  return M[nav] ? nav : 'it';
}
function render(lang) {
  const m = M[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = `PolGraph OSINT · ${m.title}`;
  document.getElementById('hsub').textContent = m.sub;
  document.getElementById('langs').innerHTML = LANGS.map(([c, n]) =>
    `<button type="button" data-lang="${c}" class="${c === lang ? 'active' : ''}">${n}</button>`).join('');
  const toc = m.sections.map(s => `<a href="#${s.id}">${s.h}</a>`).join('') + `<a href="#shortcuts">${m.shortcuts}</a>`;
  const kbd = `<h2 id="shortcuts">${m.shortcuts}</h2><table><tr><th>${m.kbdHead[0]}</th><th>${m.kbdHead[1]}</th></tr>` +
    m.kbd.map(([k, a]) => `<tr><td><kbd>${k}</kbd></td><td>${a}</td></tr>`).join('') + '</table>';
  document.getElementById('main').innerHTML =
    `<h1>${m.title}</h1><div class="meta">PolGraph OSINT · based on OSInt Graph by Andrea Cumini · <a href="https://www.osintinfo.net" target="_blank" rel="noopener">www.osintinfo.net</a></div>` +
    `<div class="toc"><b>${m.toc}</b>${toc}</div>` +
    m.sections.map(s => `<h2 id="${s.id}">${s.h}</h2>${s.body}`).join('') + kbd;
  try { localStorage.setItem('manualLang', lang); } catch (_) {}
  history.replaceState(null, '', `?lang=${lang}${location.hash}`);
}
document.getElementById('langs').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (b) { render(b.dataset.lang); window.scrollTo(0, 0); }
});
render(pickLang());
</script>
</body>
</html>
