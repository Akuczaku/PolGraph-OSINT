<style>
  :root { --bg:#1a1a1a; --panel:#2a2a2a; --line:#3a3a3a; --tx:#fff; --tx2:#aaa; --acc:#4ade80; --brand:#7B95DD; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#e5e5e5; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; line-height:1.6; }
  header { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:2px solid var(--line); padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header .logo { font-weight:800; font-size:22px; letter-spacing:.5px; }
  header .logo b { color:var(--brand); font-weight:800; }
  header .sub { color:var(--tx2); font-size:13px; }
  .langs { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .langs button { background:var(--line); color:#fff; border:0; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .langs button.active { background:var(--acc); color:#000; font-weight:700; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 60px; }
  h1 { color:var(--acc); font-size:26px; margin:10px 0 4px; }
  h2 { color:var(--acc); font-size:19px; margin:38px 0 10px; padding-top:14px; border-top:1px solid var(--line); scroll-margin-top:70px; }
  h3 { font-size:15px; margin:18px 0 6px; color:#fff; }
  p, li { font-size:14px; }
  a { color:var(--acc); }
  code, kbd { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-family:Consolas,'Courier New',monospace; font-size:13px; color:#fbbf24; }
  kbd { color:#fff; }
  table { border-collapse:collapse; width:100%; margin:10px 0 16px; font-size:13px; }
  th, td { border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  th { background:var(--panel); color:var(--acc); }
  .note { background:var(--panel); border-left:4px solid var(--acc); border-radius:4px; padding:10px 14px; margin:14px 0; font-size:13px; }
  .warn { border-left-color:#fbbf24; }
  .toc { background:var(--panel); border-radius:6px; padding:12px 18px; columns:2; column-gap:30px; margin:16px 0 10px; }
  .toc a { display:block; padding:2px 0; font-size:13px; text-decoration:none; }
  .toc a:hover { text-decoration:underline; }
  figure { margin:14px 0 20px; }
  figure img { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:6px; }

  .two { display:flex; gap:16px; flex-wrap:wrap; }
  .two figure { flex:1 1 300px; }
  .meta { color:var(--tx2); font-size:12px; margin-bottom:10px; }
  html[dir="rtl"] th, html[dir="rtl"] td { text-align:right; }
  html[dir="rtl"] .note { border-left:0; border-right:4px solid var(--acc); }
  html[dir="rtl"] .note.warn { border-right-color:#fbbf24; }
  @media print { header { position:static; } .langs { display:none; } body { background:#fff; color:#000; } h1,h2 { color:#000; } th { background:#eee; color:#000; } code, kbd, .note, .toc { background:#f2f2f2; color:#000; } figure img { border-color:#ccc; } }

<body>

  <div><div class="logo">OSInt<b>Graph</b></div><div class="sub" id="hsub"></div></div>

<script>
/* ------------------------------------------------------------------ testi --
   M[lingua] = { title, sub, toc, kbd: {k, a}, sections: [{id, h, body}] }
   Le immagini sono condivise: l'interfaccia nelle schermate e' in italiano. */
const IMG = {
  first: 'img/01-primo-avvio.jpg', over: 'img/02-panoramica.jpg', search: 'img/03-ricerca.jpg',
  card: 'img/04-scheda-nodo.jpg', add: 'img/05-nuovo-nodo.jpg', edge: 'img/06-modifica-collegamento.jpg',
  edit: 'img/07-modifica-valori.jpg', ctx: 'img/08-menu-contestuale.jpg', link: 'img/09-collega-nodi.jpg',
  imp1: 'img/10-import-1-file.jpg', imp2: 'img/11-import-2-colonne.jpg', imp3: 'img/12-import-3-anteprima.jpg',
  ai: 'img/13-configurazione-ai.jpg', lic: 'img/14-licenze.jpg', caseEdit: 'img/15-modifica-caso.jpg',
  manual: 'img/16-modifiche-manuali.jpg', sideTop: 'img/17-pannello-alto.png', sideBottom: 'img/18-pannello-basso.png'
};
const fig = (src, cap, cls = '') => `<figure class="${cls}"><img src="${src}" alt="${cap.replace(/"/g, '&quot;')}" loading="lazy"><figcaption>${cap}</figcaption></figure>`;

const M = {};

/* ================================================================ ITALIANO */
M.it = {
  title: 'Manuale d\'uso', sub: 'PolGraph OSINT · esplorazione grafica di dati OSINT per casi investigativi',
  toc: 'Indice', shortcuts: 'Scorciatoie da mouse e tastiera',
  kbdHead: ['Azione', 'Effetto'],
  kbd: [
    ['Clic su un nodo', 'Espande il nodo (mostra i suoi collegamenti); un secondo clic lo contrae'],
    ['Tasto destro su un nodo', 'Apre la scheda del nodo'],
    ['Tasto destro su un collegamento', 'Apre la finestra di modifica del collegamento'],
    ['Tasto destro sullo sfondo', 'Menu contestuale con «Nuovo nodo»'],
    ['Ctrl+clic (o ⌘+clic) su un nodo', 'Aggiunge o toglie il nodo dalla selezione'],
    ['Ctrl+trascina sullo sfondo', 'Riquadro di selezione: i nodi racchiusi si aggiungono alla selezione'],
    ['Alt+clic su un nodo social', 'Apre il profilo (finestra affiancata, scheda di sfondo o copia del link, come scelto nel pannello)'],
    ['H+clic su un nodo', 'Evidenzia il nodo e i suoi collegamenti, attenuando il resto; di nuovo per togliere'],
    ['N+clic su un nodo', 'Nasconde il nodo dalla vista (solo visualizzazione, i dati restano)'],
    ['Rotella del mouse / trascinamento', 'Zoom e spostamento del grafo'],
    ['Esc', 'Chiude la finestra aperta'],
    ['Invio nel campo nome di un collegamento', 'Salva'],
    ['Barra del titolo di una finestra', 'Trascinala per spostare la finestra; doppio clic per ricentrarla'],
  ],
  sections: [
   { id: 'intro', h: '1. Che cos\'è PolGraph OSINT', body: `
<p>PolGraph OSINT rappresenta come <b>grafo</b> le informazioni di un caso investigativo: persone, telefoni, email, profili social, veicoli, luoghi, documenti e i collegamenti fra loro. Ogni elemento è un <b>nodo</b>, ogni relazione un <b>collegamento</b>. Il programma gira sul tuo computer: i dati non lasciano mai il PC, salvo l'uso facoltativo di un servizio di intelligenza artificiale che configuri tu.</p>
<p>Si avvia con un doppio clic sull'eseguibile (oppure, dal codice sorgente, con <code>python app.py</code>): parte un piccolo server locale e si apre il browser all'indirizzo <code>http://127.0.0.1:5000</code>. La finestra della console mostra i messaggi del programma e serve a fermarlo (<kbd>Ctrl</kbd>+<kbd>C</kbd> o chiusura della finestra). La porta si cambia con la variabile d'ambiente <code>PORT</code>.</p>
<div class="note">Il programma è software libero (GNU GPL v3 con obbligo di attribuzione). Le licenze del programma e di tutti i componenti si leggono dal link <b>Licencje</b> nel pannello di sinistra.</div>` },
   { id: 'cases', h: '2. Casi: primo avvio e gestione', body: `
<p>Tutto il lavoro è organizzato in <b>casi</b> (fascicoli). Ogni caso è un archivio separato con i propri nodi, collegamenti, note, viste e file importati. Al primo avvio non esiste alcun caso: il programma chiede subito di crearne uno, e finché non c'è un caso aperto non si possono aggiungere nodi né importare dati.</p>
${fig(IMG.first, 'Primo avvio: nessun caso aperto, la finestra «Nuovo caso» si apre da sola.')}
<p>Nel riquadro <b>Caso</b> in alto nel pannello:</p>
<ul>
<li>la <b>tendina</b> mostra il caso aperto; scegliendone un altro la pagina si ricarica con i suoi dati;</li>
<li><b>Nowa</b> crea un caso vuoto e lo apre; <b>Edytuj</b> cambia nome e descrizione;</li>
<li><b>Połącz</b> crea un nuovo caso con il contenuto di due o più casi: i nodi uguali (stessa persona, stesso telefono…) diventano uno solo e i dati diversi restano come schede separate dello stesso nodo; a scelta i casi originali vengono eliminati;</li>
<li><b>Usuń</b> cancella il caso con tutto il suo contenuto. L'operazione non si può annullare: se era l'ultimo caso si torna allo stato iniziale senza casi.</li>
</ul>
${fig(IMG.caseEdit, 'Modifica di nome e descrizione del caso.')}` },
   { id: 'interface', h: '3. L\'interfaccia', body: `
<p>A sinistra il <b>pannello dei comandi</b>, a destra il <b>grafo</b> su sfondo bianco. Il pannello si scorre verticalmente e contiene, dall'alto: logo e crediti, il caso, la ricerca, i pulsanti principali, l'intelligenza artificiale, le viste salvate, le fonti documentali, i filtri per categoria, le opzioni dei collegamenti e del layout, l'esportazione, la selezione, la legenda e la riga di stato.</p>
${fig(IMG.over, 'Panoramica: pannello a sinistra, grafo a destra. Il nodo dorato è il target, le linee tratteggiate rosse i collegamenti personalizzati.')}
<div class="two">
${fig(IMG.sideTop, 'Parte alta del pannello.', 'narrow')}
${fig(IMG.sideBottom, 'Parte bassa del pannello: layout, esportazione, selezione, legenda.', 'narrow')}
</div>
<p>I nodi hanno un'icona e un colore per tipo (persona, telefono, email, social con il logo della piattaforma, veicolo, luogo, link, testo, foto). Il <b>target</b> ha dimensione maggiore, bordo e nome dorati. I nodi che provengono dai dati di partenza hanno il bordo rosso. Un nodo espanso ha il bordo doppio.</p>` },
   { id: 'search', h: '4. Cercare e portare nodi sul grafo', body: `
<p>Scrivi almeno tre caratteri nel campo <b>Cerca nodo</b>: l'elenco mostra i nodi che contengono il testo nel nome, negli alias, nelle note e nei valori delle schede. Un clic su un risultato porta il nodo sul grafo e lo centra. <b>Aggiungi tutti i risultati</b> li porta tutti insieme; <b>Carica tutti i target</b> aggiunge i target del caso.</p>
${fig(IMG.search, 'Risultati della ricerca con tipo del nodo e segno di spunta per quelli già sul grafo.')}
<p>Con <b>Ricerca approssimata</b> si trovano anche le grafie vicine (errori di battitura, traslitterazioni diverse); il livello da 1 a 6 indica quante differenze tollerare. <b>Svuota grafo</b> toglie tutti i nodi dalla vista senza cancellare nulla.</p>` },
   { id: 'graph', h: '5. Muoversi nel grafo', body: `
<p>Il grafo si sposta trascinando lo sfondo e si ingrandisce con la rotella. <b>Adatta</b> riporta tutto nella finestra. Un <b>clic su un nodo</b> lo espande, mostrando i nodi collegati entro la profondità scelta in <b>Prof.</b> (1 = solo i vicini diretti); un <b>secondo clic</b> lo contrae, nascondendo i vicini che si vedevano grazie a lui (restano quelli collegati ad altri nodi espansi o selezionati). <b>Espandi tutto</b> e <b>Comprimi</b> agiscono su tutti i nodi visibili.</p>
<p>Il <b>tasto destro</b> su un nodo apre la sua scheda; su un collegamento apre la finestra del collegamento; sullo sfondo apre un menu con <b>Nowy węzeł</b>.</p>
${fig(IMG.ctx, 'Tasto destro sullo sfondo: menu contestuale.')}
<p>Con <kbd>Ctrl</kbd>+clic (o <kbd>Ctrl</kbd>+trascinamento di un riquadro) si costruisce una <b>selezione</b> di nodi, elencata nel riquadro <b>Selezione</b>: da lì si evidenziano tutti i percorsi fra i nodi scelti (entro un numero massimo di salti) e si creano collegamenti fra loro. <kbd>H</kbd>+clic evidenzia un nodo e i suoi collegamenti attenuando il resto; <kbd>N</kbd>+clic nasconde un nodo (il pulsante <b>Mostra nascosti</b> li fa ricomparire). <kbd>Alt</kbd>+clic su un profilo social lo apre nel browser secondo la scelta in <b>Alt+Click sui social</b>.</p>
<p><b>Mostra nodi con</b> filtra il grafo per numero minimo di collegamenti: utile per far emergere i nodi più connessi.</p>` },
   { id: 'card', h: '6. La scheda del nodo', body: `
<p>La scheda (tasto destro sul nodo) riunisce tutto ciò che si sa di quel nodo: la <b>nota</b> dell'utente, il <b>riepilogo dei collegamenti</b> raggruppati per categoria (social per piattaforma, poi telefoni, email, luoghi, veicoli…), le <b>schede</b> con i dati grezzi e le immagini. Ogni valore si copia negli appunti con un clic; i nomi dei nodi collegati sono cliccabili e portano al nodo.</p>
${fig(IMG.card, 'Scheda del target con nota, riepilogo dei collegamenti e pulsanti in basso.')}
<p>I pulsanti in basso: <b>Espandi ramo / Comprimi</b>, <b>Centra nel grafo</b>, <b>Cerca nelle fonti</b> (i termini della scheda nei documenti indicizzati), <b>Aggiungi</b> (un nuovo nodo collegato a questo), <b>Importa con AI</b> (testo libero interpretato dall'AI), <b>Rinomina</b>, <b>Modifica valori</b>, <b>Nota</b>, <b>PDF</b> (la scheda stampabile) ed <b>Elimina nodo</b>. Un nodo dei dati eliminato finisce fra i <b>Nodi cancellati</b>, da cui si può ripristinare; un nodo creato a mano viene cancellato davvero.</p>` },
   { id: 'add', h: '7. Aggiungere un nodo', body: `
<p><b>Nowy węzeł</b> nel pannello (o nel menu del tasto destro sullo sfondo) crea un nodo indipendente; <b>Aggiungi</b> nella scheda di un nodo crea un nodo già collegato a quello. Si sceglie il <b>tipo</b> e si compilano i campi relativi: URL del profilo per i social (la piattaforma viene riconosciuta dall'indirizzo), numero, email, username, cognome, nome e data di nascita per le persone, città, indirizzo, civico e coordinate per i luoghi, targa e colore per i veicoli, titolo e testo per gli appunti, immagine per le foto, più gli elementi investigativi (armi, stupefacenti, documenti…).</p>
${fig(IMG.add, 'Nuovo nodo collegato a un target: tipo, valore, spunta target, proprietà del collegamento e anteprima.')}
<p>Qualsiasi nodo può essere evidenziato come <b>target</b> con la spunta <b>Evidenzia come target</b>. Se il nodo nasce collegato a un altro, in basso ci sono le <b>proprietà del collegamento</b>: nome, forma della linea, tipo di linea, spessore e colore. Le <b>frecce</b> si impostano direttamente sull'<b>anteprima</b>: un clic accanto a un nodo mette o toglie la punta della freccia verso quel nodo (al passaggio del mouse compare la punta in trasparenza).</p>
<p>Il pulsante <b>✨ AI</b> in alto nella finestra passa alla modalità testo libero: incolli un testo (un verbale, una segnalazione, un messaggio) e l'AI propone persone, telefoni, email, profili, luoghi e veicoli con le loro relazioni; prima di crearli si controllano in un'anteprima.</p>` },
   { id: 'links', h: '8. Collegamenti', body: `
<p>Per collegare nodi già presenti: selezionali con <kbd>Ctrl</kbd>+clic e premi <b>Collega i nodi selezionati</b>. Con due nodi si sceglie il verso (il pulsante ⇄ li scambia); con più nodi si collegano tutte le coppie. Fra due nodi possono esistere più collegamenti, ognuno con il proprio nome.</p>
${fig(IMG.link, 'Collega nodi: nome, forma, linea, spessore, colore e frecce dall\'anteprima (qui in entrambi i versi).')}
<p>Il <b>tasto destro su un collegamento</b> apre la sua finestra: si modificano nome e aspetto, si invertono le frecce, si passa agli altri collegamenti fra gli stessi nodi, se ne crea un altro, e per i collegamenti creati a mano si elimina. Per i collegamenti che vengono dai dati si cambia solo l'aspetto; <b>Stile predefinito</b> lo riporta com'era.</p>
${fig(IMG.edge, 'Modifica di un collegamento: arco curvo rosso tratteggiato con frecce in entrambi i versi.')}
<p>Nel pannello, <b>Stile dei collegamenti</b> applica forma, tipo di linea e spessore a <b>tutti</b> i collegamenti del grafo contemporaneamente; è una preferenza di visualizzazione che non modifica i dati e si annulla scegliendo «come impostati».</p>` },
   { id: 'edit', h: '9. Modificare i valori di un nodo', body: `
<p>Dalla scheda, <b>Modifica valori</b> apre tutti i dati del nodo: etichetta, URL (aperto con Alt+clic), nota, la spunta <b>Evidenzia come target</b> e i campi di ogni scheda. I valori si cambiano o si segnano come cancellati con ✕; si possono aggiungere campi liberi. Le modifiche non toccano i file di origine: restano nel caso e si applicano al volo. <b>Annulla tutte le modifiche</b> riporta il nodo ai dati originali.</p>
${fig(IMG.edit, 'Modifica valori: campi generali, spunta target e campi della scheda (compresi quelli importati da un CSV).')}` },
   { id: 'import', h: '10. Importare da CSV o Excel', body: `
<p><b>Importa CSV/Excel</b> crea molti nodi e collegamenti in una volta, in tre passi. Il file ha una riga per collegamento: nodo 1, collegamento, nodo 2; senza nodo 2 si crea un nodo isolato.</p>
${fig(IMG.imp1, 'Passo 1: il file. Il pulsante «Scarica un file di esempio» produce un modello già compilato.')}
<p>Nel <b>passo 2</b> ogni colonna del file compare con alcuni valori di esempio e una tendina <b>Importa come</b>. Le colonne con intestazioni riconosciute sono già assegnate; le altre vengono proposte come <b>campo aggiuntivo del nodo 1</b>, così finiscono nella scheda del nodo con il nome della colonna e nessun valore va perso. Si possono indicare un tipo predefinito per i nodi senza colonna tipo, un nome predefinito per il collegamento e se la prima riga contiene le intestazioni.</p>
${fig(IMG.imp2, 'Passo 2: mappatura delle colonne.')}
<p>Il <b>passo 3</b> mostra cosa verrà creato riga per riga: nodi nuovi, nodi già presenti (in corsivo), collegamenti ed eventuali errori. Le righe si possono escludere singolarmente; poi <b>Importa</b>.</p>
${fig(IMG.imp3, 'Passo 3: anteprima e importazione.')}
<h3>Intestazioni riconosciute</h3>
<table>
<tr><th>Dato</th><th>Intestazioni (italiano / inglese), con 1 o 2 per il lato</th></tr>
<tr><td>Nome o valore del nodo</td><td>nome, nome1, nome2, name, valore, value, da/a, from/to</td></tr>
<tr><td>Tipo</td><td>tipo, type (persona, telefono, email, username, social o direttamente instagram/facebook/…, link, luogo, veicolo, testo, target)</td></tr>
<tr><td>Altri dati del nodo</td><td>etichetta/label, url, piattaforma/platform, testo/text, cognome/surname, nascita/birthdate, colore/color (veicolo), target (sì/no), indirizzo/address, civico/housenumber, lat, lon, nota/note</td></tr>
<tr><td>Collegamento</td><td>collegamento/relation, frecce/arrow (-> &lt;- &lt;-&gt;), forma/shape (retta, curva, spezzata, angolo, cuneo), colore/color, linea/line (continua, tratteggiata, punteggiata), spessore/width</td></tr>
</table>
<div class="note warn">Una persona è identificata da <b>nome e data di nascita insieme</b>: se la data compare solo in alcune righe, «Rossi Mario (12/03/1980)» e «Rossi Mario» diventano due nodi distinti, collegati da un tratteggio. Nel file ripeti la data su ogni riga della stessa persona. Due file di esempio completi sono nella cartella <code>esempi</code> del programma.</div>` },
   { id: 'filters', h: '11. Categorie, layout e aspetto', body: `
<p>I pulsanti <b>Categorie</b> spengono o accendono intere categorie di nodi (telefoni, social, luoghi…), ognuno con il colore della categoria e il conteggio; <b>Nascondi tutto / Mostra tutto</b> agisce su tutte. Un'azione esplicita (espansione, aggiunta) riporta comunque visibili i nodi coinvolti.</p>
<p><b>Layout</b>: <b>Organico</b> dispone i nodi per forza (i collegati vicini), <b>Circolare</b> in cerchio, <b>Gerarchico</b> ad albero, <b>Griglia</b> in righe e colonne; <b>Riduci incroci</b> riordina il grafo attuale per diminuire gli incroci. L'espansione di un nodo dispone soltanto i nodi nuovi in corona attorno a lui, senza muovere gli altri né la camera.</p>
<p><b>Identificatori</b> mostra o nasconde i nodi identificativi (telefoni, email, username) usati come ponte fra persone. La <b>legenda</b> in fondo al pannello riporta i colori delle categorie presenti.</p>` },
   { id: 'views', h: '12. Viste salvate', body: `
<p>Una <b>vista</b> è la fotografia del grafo com'è ora: nodi visibili, espansi, posizioni, zoom e selezione. Scrivi un nome e premi <b>Salva vista</b>; la tendina elenca le viste del caso, <b>Apri</b> la ripristina e 🗑 la elimina. Le viste servono a riprendere un ragionamento o a preparare la schermata da esportare.</p>` },
   { id: 'sources', h: '13. Fonti documentali e OCR', body: `
<p>Metti i documenti (PDF, Word, Excel, CSV, testo, immagini) nella cartella <code>fonti</code> accanto al programma e premi <b>Scansiona</b>: il contenuto viene indicizzato nel programma. Da quel momento <b>Cerca nelle fonti</b>, nel pannello o nella scheda di un nodo, trova in quali documenti compaiono un termine o i valori del nodo (numeri, nomi, email), con il brano di contesto e il link per aprire il file.</p>
<p>Le <b>immagini</b> (foto di documenti, screenshot) si leggono con l'<b>OCR</b> di Tesseract. Se la riga di stato dice «OCR non disponibile», su Windows basta il pulsante <b>Scarica Tesseract (OCR)</b>: il programma scarica l'installer ufficiale (circa 50 MB), lo estrae nella cartella <code>tools/tesseract</code> accanto al programma e attiva l'OCR senza riavviare. Su Linux e Mac si installa Tesseract dal gestore pacchetti.</p>` },
   { id: 'ai', h: '14. Intelligenza artificiale', body: `
<p>Il programma può usare un <b>chatbot</b> (un server compatibile Ollama oppure con API OpenAI, locale o remoto) per due cose: <b>creare nodi da un testo libero</b> e <b>traslitterare</b> in caratteri latini i nomi scritti in altri alfabeti. L'AI è facoltativa: con l'interruttore <b>AI attiva</b> spento il programma non si collega a nulla e usa solo la traslitterazione locale.</p>
${fig(IMG.ai, 'Configurazione AI: endpoint, chiave, modello, formato API, timeout e traslitterazione automatica.')}
<p><b>Configura</b> apre le impostazioni: indirizzo del server, chiave API (salvata nel file <code>chatbot.conf</code> accanto al programma, mai pubblicarlo), modello, formato delle richieste, tempo massimo di attesa, intestazione e prefisso della chiave. <b>Prova connessione</b> verifica che il server risponda. Il pulsante <b>Traslittera con AI</b> compare nel pannello quando ci sono parole da traslitterare.</p>
<div class="note warn">I testi che incolli nella modalità AI e i nomi da traslitterare vengono inviati al server che hai configurato. Usa un server di cui ti fidi, o uno locale, se i dati sono riservati.</div>` },
   { id: 'manual', h: '15. Modifiche manuali e nodi cancellati', body: `
<p><b>Modifiche manuali</b> elenca tutto ciò che è stato creato o cambiato a mano nel caso: nodi aggiunti (anche quelli importati da file o proposti dall'AI), collegamenti creati ed etichette rinominate, con un filtro per nome. Da qui si elimina ciò che non serve più. <b>Nodi cancellati</b> elenca i nodi dei dati tolti dal grafo e permette di ripristinarli uno per uno o tutti insieme.</p>
${fig(IMG.manual, 'Modifiche manuali: nodi aggiunti a mano con data e collegamenti.')}` },
   { id: 'export', h: '16. Esportare', body: `
<p><b>Grafo in PDF</b> stampa il grafo com'è a schermo, con legenda e intestazione del caso. <b>Scheda tabellare</b> produce un documento con tutti i nodi visibili e i loro dati, in tabella, pronto per la stampa o il salvataggio in PDF dal browser. Dalla scheda di un nodo, <b>PDF</b> esporta quella sola scheda. Il file CSV d'esempio si scarica dalla finestra di importazione.</p>` },
   { id: 'lang', h: '17. Lingue, licenze e crediti', body: `
<p>La lingua dell'interfaccia si sceglie dalla tendina accanto al logo (italiano, inglese, francese, tedesco, spagnolo, arabo con testo da destra a sinistra); i contenuti dei dati non vengono tradotti. Sotto il logo ci sono i crediti dell'autore e il link <b>Licencje</b>, che elenca il programma e tutti i componenti di terze parti con i testi completi delle licenze.</p>
${fig(IMG.lic, 'Finestra delle licenze: a sinistra i componenti, a destra il testo.')}` },
   { id: 'files', h: '18. Dati, cartelle e file', body: `
<table>
<tr><th>Cartella / file</th><th>Contenuto</th></tr>
<tr><td><code>data/</code></td><td>Tutti i dati: l'archivio generale (casi, dizionario di traslitterazione, indice delle fonti) e la cartella <code>cases</code> con un database per ogni caso. Salvane una copia per il backup.</td></tr>
<tr><td><code>data/media/</code></td><td>Le immagini caricate nei nodi foto.</td></tr>
<tr><td><code>fonti/</code></td><td>I documenti da indicizzare per la ricerca nelle fonti.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>Configurazione dell'AI con la chiave del server: non va condiviso. <code>chatbot.conf.example</code> è il modello vuoto.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Tesseract OCR scaricato dal programma.</td></tr>
<tr><td><code>esempi/</code></td><td>File CSV di esempio per l'importazione.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>Licenza del programma, termini aggiuntivi e licenze dei componenti.</td></tr>
</table>
<p>Il programma è portabile: la cartella si può copiare su un altro PC con tutti i dati. Per il backup è sufficiente copiare la cartella <code>data</code> (e <code>fonti</code>, se serve).</p>` },
  ]
};

  sections: [
   { id: 'intro', h: '1. Czym jest PolGraph OSINT', body: `
<p>PolGraph OSINT przedstawia informacje dotyczące sprawy jako interaktywny <b>graf</b>: osoby, telefony, adresy e-mail, profile społecznościowe, pojazdy, miejsca, dokumenty i relacje pomiędzy nimi. Każdy element jest <b>węzłem</b>, a każde powiązanie — <b>relacją</b>. Program działa lokalnie na komputerze. Dane nie opuszczają komputera, z wyjątkiem opcjonalnego użycia usługi AI skonfigurowanej przez użytkownika.</p>
<p>Program uruchamia się z pliku wykonywalnego albo ze źródeł poleceniem <code>python app.py</code>. Startuje lokalny serwer i otwiera przeglądarkę pod adresem <code>http://127.0.0.1:5000</code>. Port można zmienić zmienną środowiskową <code>PORT</code>.</p>
<div class="note">PolGraph OSINT jest oprogramowaniem wolnym na licencji GNU GPL v3 z dodatkowymi warunkami atrybucji. Oryginalne teksty licencji są dostępne z poziomu aplikacji.</div>` },
   { id: 'cases', h: '2. Sprawy: pierwszy start i zarządzanie', body: `
<p>Cała praca jest uporządkowana w <b>sprawy</b>. Każda sprawa ma oddzielny zestaw węzłów, relacji, notatek, zapisanych widoków i danych. Przy pierwszym uruchomieniu aplikacja poprosi o utworzenie pierwszej sprawy.</p>
${fig(IMG.first, 'Pierwsze uruchomienie: brak otwartej sprawy.')}
<p>W sekcji <b>Sprawa</b> możesz wybrać istniejącą sprawę, utworzyć nową, edytować jej nazwę i opis, połączyć kilka spraw lub usunąć sprawę wraz z jej zawartością.</p>
<ul><li><b>Nowa</b> — tworzy pustą sprawę.</li><li><b>Edytuj</b> — zmienia nazwę i opis.</li><li><b>Połącz</b> — tworzy nową sprawę z zawartości kilku spraw, próbując scalać odpowiadające sobie węzły.</li><li><b>Usuń</b> — usuwa sprawę; operacji nie można cofnąć.</li></ul>
${fig(IMG.caseEdit, 'Edycja nazwy i opisu sprawy.')}` },
   { id: 'interface', h: '3. Interfejs', body: `
<p>Po lewej stronie znajduje się <b>panel sterowania</b>, a po prawej <b>graf</b>. Panel zawiera m.in. wybór sprawy, wyszukiwanie, główne operacje, AI, zapisane widoki, źródła dokumentowe, filtry kategorii, ustawienia relacji i układu oraz eksport.</p>
${fig(IMG.over, 'Widok główny: panel sterowania po lewej, graf po prawej.')}
<div class="two">${fig(IMG.sideTop, 'Górna część panelu.', 'narrow')}${fig(IMG.sideBottom, 'Dolna część panelu.', 'narrow')}</div>
<p>Kolory i ikony pomagają rozróżniać typy węzłów. Węzeł oznaczony jako <b>cel</b> jest wyróżniony. Węzeł rozwinięty ma dodatkowe oznaczenie.</p>` },
   { id: 'search', h: '4. Wyszukiwanie i dodawanie węzłów do grafu', body: `
<p>Wpisz co najmniej trzy znaki w polu <b>Szukaj węzła</b>. Wyniki mogą obejmować nazwę, aliasy, notatki i wartości zapisane w kartach węzła. Kliknięcie wyniku dodaje węzeł do grafu i centruje widok.</p>
${fig(IMG.search, 'Wyniki wyszukiwania z typem węzła.')}
<p><b>Wyszukiwanie przybliżone</b> pozwala odnajdywać podobne zapisy, literówki i różne transliteracje. <b>Wyczyść graf</b> usuwa elementy jedynie z bieżącego widoku — nie kasuje danych.</p>` },
   { id: 'graph', h: '5. Poruszanie się po grafie', body: `
<p>Przeciąganie tła przesuwa graf, a kółko myszy zmienia powiększenie. <b>Dopasuj</b> ustawia wszystkie widoczne elementy w obszarze roboczym. Kliknięcie węzła rozwija jego sąsiadów zgodnie z ustawioną głębokością, kolejne kliknięcie zwija gałąź.</p>
${fig(IMG.ctx, 'Menu kontekstowe grafu.')}
<p>Za pomocą <kbd>Ctrl</kbd> można zaznaczać wiele węzłów. <kbd>H</kbd> podświetla sąsiedztwo, a <kbd>N</kbd> ukrywa węzeł w bieżącym widoku. Operacje te nie usuwają danych ze sprawy.</p>` },
   { id: 'card', h: '6. Karta węzła', body: `
<p>Karta węzła pokazuje wszystkie informacje o wybranym elemencie: notatkę, podsumowanie relacji, dane źródłowe, dodatkowe pola i obrazy. Wartości można kopiować, a nazwy powiązanych węzłów prowadzą do odpowiednich elementów grafu.</p>
${fig(IMG.card, 'Karta węzła z danymi i relacjami.')}
<p>Z karty można rozwinąć gałąź, wyśrodkować węzeł, przeszukać źródła, dodać powiązany węzeł, użyć importu AI, zmienić nazwę, edytować dane, dodać notatkę, wygenerować PDF lub usunąć węzeł.</p>` },
   { id: 'add', h: '7. Dodawanie węzła', body: `
<p><b>Nowy węzeł</b> tworzy niezależny element, a przycisk <b>Dodaj</b> z karty istniejącego węzła tworzy element już z nim połączony. Dostępne są m.in. osoby, telefony, e-maile, konta społecznościowe, pojazdy, miejsca, linki, tekst, zdjęcia i elementy analityczne.</p>
${fig(IMG.add, 'Dodawanie nowego węzła wraz z właściwościami relacji.')}
<p>Każdy węzeł można oznaczyć jako <b>cel</b>. Przy tworzeniu relacji można ustawić jej nazwę, kształt, styl linii, szerokość, kolor oraz kierunek strzałek.</p>
<p>Tryb <b>AI</b> pozwala wkleić tekst, z którego skonfigurowany model może zaproponować węzły i relacje do zatwierdzenia.</p>` },
   { id: 'links', h: '8. Relacje', body: `
<p>Aby połączyć istniejące węzły, zaznacz je i wybierz opcję tworzenia relacji. Relacja może mieć nazwę, kierunek, kształt, styl, kolor i szerokość. Pomiędzy tymi samymi dwoma węzłami może istnieć więcej niż jedna relacja.</p>
${fig(IMG.link, 'Tworzenie relacji pomiędzy zaznaczonymi węzłami.')}
${fig(IMG.edge, 'Edycja relacji i jej wyglądu.')}
<p>Prawy przycisk myszy na relacji otwiera jej edytor. Ustawienia wyglądu nie muszą zmieniać danych źródłowych — mogą być tylko sposobem prezentacji grafu.</p>` },
   { id: 'edit', h: '9. Edycja wartości węzła', body: `
<p><b>Edytuj wartości</b> pozwala zmieniać etykietę, adres URL, notatkę, status celu oraz pola zapisane w kartach danych. Można też dodawać własne pola. Zmiany są przechowywane w sprawie i nie modyfikują oryginalnych plików źródłowych.</p>
${fig(IMG.edit, 'Edycja pól węzła.')}` },
   { id: 'import', h: '10. Import z CSV lub Excel', body: `
<p><b>Importuj CSV/Excel</b> służy do tworzenia wielu węzłów i relacji jednocześnie. Kreator działa w trzech etapach: wybór pliku, mapowanie kolumn i podgląd przed importem.</p>
${fig(IMG.imp1, 'Krok 1: wybór pliku CSV lub Excel.')}
<p>W <b>kroku 2</b> każdej kolumnie przypisujesz znaczenie. Rozpoznane nagłówki mogą zostać przypisane automatycznie, a nieznane kolumny mogą trafić jako pola dodatkowe.</p>
${fig(IMG.imp2, 'Krok 2: mapowanie kolumn.')}
<p><b>Krok 3</b> pokazuje, jakie węzły i relacje zostaną utworzone. Poszczególne wiersze można wyłączyć przed zatwierdzeniem.</p>
${fig(IMG.imp3, 'Krok 3: podgląd importu.')}
<h3>Polskie nagłówki</h3><p>W polskiej wersji można dodatkowo używać nagłówków takich jak: <code>imię i nazwisko</code>, <code>telefon</code>, <code>email</code>, <code>adres</code>, <code>miasto</code>, <code>PESEL</code>, <code>NIP</code>, <code>REGON</code>, <code>KRS</code>, <code>VIN</code> i <code>IBAN</code>.</p>
<div class="note warn">Dla osób staraj się używać stabilnego identyfikatora albo konsekwentnie podawać imię, nazwisko i datę urodzenia. Niespójne dane mogą utworzyć kilka podobnych węzłów.</div>` },
   { id: 'filters', h: '11. Kategorie, układ i wygląd', body: `
<p>Filtry <b>Kategorie</b> pokazują lub ukrywają całe grupy węzłów. Dostępne układy obejmują m.in. organiczny, kołowy, hierarchiczny i siatkowy. Funkcja redukcji przecięć może poprawić czytelność dużych grafów.</p>
<p>Opcja identyfikatorów pozwala pokazywać lub ukrywać pośrednie węzły, np. telefony, adresy e-mail i nazwy użytkowników.</p>` },
   { id: 'views', h: '12. Zapisane widoki', body: `
<p><b>Zapisany widok</b> przechowuje stan prezentacji grafu: widoczne węzły, rozwinięcia, położenie, powiększenie i zaznaczenia. Ułatwia to powrót do konkretnego sposobu analizy lub przygotowanie widoku do eksportu.</p>` },
   { id: 'sources', h: '13. Źródła dokumentowe i OCR', body: `
<p>Dokumenty można umieścić w folderze <code>fonti</code> i zindeksować z poziomu programu. Obsługiwane są m.in. PDF, Word, Excel, CSV, pliki tekstowe oraz obrazy. Wyszukiwanie źródeł pokazuje dokument, kontekst wystąpienia i możliwość otwarcia pliku.</p>
<p>Obrazy mogą być analizowane przez <b>Tesseract OCR</b>. Na Windows aplikacja może pobrać Tesseract do lokalnego folderu <code>tools/tesseract</code>.</p>` },
   { id: 'ai', h: '14. Sztuczna inteligencja', body: `
<p>PolGraph OSINT może korzystać z serwera zgodnego z Ollama lub API OpenAI. AI jest opcjonalna i służy m.in. do proponowania węzłów z tekstu oraz transliteracji nazw zapisanych innymi alfabetami.</p>
${fig(IMG.ai, 'Konfiguracja AI: endpoint, klucz, model, format API, limit czasu i transliteracja.')}
<p>W ustawieniach podajesz adres serwera, opcjonalny klucz API, model, format żądania oraz limit czasu. Ustawienia mogą być przechowywane w <code>chatbot.conf</code>.</p>
<div class="note warn">Tekst wysyłany do AI trafia do skonfigurowanego przez Ciebie serwera. Dla danych wrażliwych używaj zaufanej infrastruktury, najlepiej lokalnej, i stosuj obowiązujące przepisy.</div>` },
   { id: 'manual', h: '15. Zmiany ręczne i usunięte węzły', body: `
<p><b>Zmiany ręczne</b> pokazują elementy utworzone lub zmienione przez operatora, w tym importowane dane i propozycje zaakceptowane z AI. Sekcja <b>Usunięte węzły</b> pozwala przywracać elementy usunięte z widoku danych, jeśli aplikacja zachowała je jako możliwe do odtworzenia.</p>
${fig(IMG.manual, 'Lista zmian ręcznych i elementów utworzonych przez operatora.')}` },
   { id: 'export', h: '16. Eksport', body: `
<p><b>Graf do PDF</b> przygotowuje bieżący widok grafu do wydruku. <b>Raport tabelaryczny</b> zestawia widoczne węzły i dane w formie tabel. Z karty węzła można również wyeksportować pojedynczą kartę.</p>` },
   { id: 'lang', h: '17. Języki, licencje i informacje o autorze', body: `
<p>Język interfejsu wybiera się z listy obok logo. Polska wersja jest niezależna od profilu <b>Polski OSINT</b>. Zmiana języka nie zmienia danych zapisanych w sprawach.</p>
${fig(IMG.lic, 'Okno licencji: lista komponentów i oryginalne teksty licencji.')}
<div class="note">Teksty licencji i informacji prawnych pozostają w oryginalnym brzmieniu. Tłumaczenia instrukcji nie zastępują treści licencyjnych.</div>` },
   { id: 'files', h: '18. Dane, foldery i pliki', body: `
<table><tr><th>Folder / plik</th><th>Zawartość</th></tr>
<tr><td><code>data/</code></td><td>Bazy danych spraw, słowniki i indeksy.</td></tr>
<tr><td><code>data/media/</code></td><td>Obrazy dołączone do węzłów.</td></tr>
<tr><td><code>fonti/</code></td><td>Dokumenty przeznaczone do indeksowania.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>Konfiguracja AI; pliku z kluczem API nie należy udostępniać.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Lokalna instalacja Tesseract OCR.</td></tr>
<tr><td><code>esempi/</code></td><td>Przykładowe pliki importu; polska wersja zawiera także przykład PL.</td></tr>
<tr><td><code>pl/</code></td><td>Dodatki polskiego profilu OSINT i narzędzia importu własnych baz.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>Oryginalne informacje licencyjne.</td></tr></table>
<p>Do kopii zapasowej najważniejszy jest folder <code>data</code>; jeżeli korzystasz ze źródeł dokumentowych, zachowaj również <code>fonti</code>.</p>` },
   { id: 'pladdons', h: '19. Dodatki polskiej wersji', body: `
<p>Polska odmiana zawiera opcjonalny profil <b>Polski OSINT</b>. Profil jest niezależny od języka interfejsu i można go włączać lub wyłączać bez usuwania danych.</p>
<ul><li>walidacja i rozpoznawanie PESEL, NIP, REGON, KRS i polskiego IBAN;</li><li>skróty do oficjalnych polskich rejestrów;</li><li>polskie typy danych i relacje;</li><li>panel <b>Moje bazy</b> do importu własnych zbiorów;</li><li>import CSV / JSON / Graph JSON, a dla SQLite pomocniczy konwerter;</li><li>pole <code>source_db</code> pozwalające śledzić pochodzenie danych.</li></ul>
<p>Funkcje polskiego profilu są dodatkiem do podstawowej aplikacji i nie zmieniają oryginalnych informacji o autorze ani warunków licencji.</p>` },
  ]
};

    ['Mouse wheel / drag', 'Zoom and pan the graph'],
    ['Esc', 'Closes the open window'],
    ['Enter in a connection name field', 'Saves'],
    ['Title bar of a window', 'Drag to move the window; double-click to re-centre it'],
  ],
  sections: [
   { id: 'intro', h: '1. What PolGraph OSINT is', body: `
<p>PolGraph OSINT shows the information of an investigative case as a <b>graph</b>: people, phones, emails, social profiles, vehicles, places, documents and the connections between them. Every item is a <b>node</b>, every relation a <b>connection</b>. The program runs on your computer: data never leaves the PC, except for the optional artificial-intelligence service you configure yourself.</p>
<p>Start it by double-clicking the executable (or, from source, with <code>python app.py</code>): a small local server starts and the browser opens at <code>http://127.0.0.1:5000</code>. The console window shows the program's messages and is the way to stop it (<kbd>Ctrl</kbd>+<kbd>C</kbd> or closing the window). The port can be changed with the <code>PORT</code> environment variable.</p>
<div class="note">The program is free software (GNU GPL v3 with an attribution requirement). The licenses of the program and of all its components can be read from the <b>Licenses</b> link in the left panel.</div>` },
   { id: 'cases', h: '2. Cases: first start and management', body: `
<p>All work is organised in <b>cases</b>. Each case is a separate archive with its own nodes, connections, notes, views and imported files. On first start there is no case: the program immediately asks you to create one, and until a case is open no nodes can be added and no data imported.</p>
${fig(IMG.first, 'First start: no case is open, the “New case” window opens by itself.')}
<p>In the <b>Case</b> box at the top of the panel:</p>
<ul>
<li>the <b>drop-down</b> shows the open case; choosing another one reloads the page with its data;</li>
<li><b>New</b> creates an empty case and opens it; <b>Edit</b> changes name and description;</li>
<li><b>Merge</b> creates a new case with the content of two or more cases: identical nodes (same person, same phone…) become one and differing data stays as separate records of the same node; optionally the original cases are deleted;</li>
<li><b>Delete</b> removes the case with all its content. This cannot be undone: if it was the last case the program returns to the initial state with no cases.</li>
</ul>
${fig(IMG.caseEdit, 'Editing the case name and description.')}` },
   { id: 'interface', h: '3. The interface', body: `
<p>On the left the <b>command panel</b>, on the right the <b>graph</b> on a white background. The panel scrolls vertically and contains, from the top: logo and credits, the case, the search, the main buttons, artificial intelligence, saved views, document sources, category filters, connection and layout options, export, selection, the legend and the status line.</p>
${fig(IMG.over, 'Overview: panel on the left, graph on the right. The golden node is the target, the red dashed lines are customised connections.')}
<div class="two">
${fig(IMG.sideTop, 'Upper part of the panel.', 'narrow')}
${fig(IMG.sideBottom, 'Lower part of the panel: layout, export, selection, legend.', 'narrow')}
</div>
<p>Nodes have an icon and a colour per type (person, phone, email, social with the platform logo, vehicle, place, link, text, photo). The <b>target</b> is larger, with a golden border and name. Nodes coming from the initial data have a red border. An expanded node has a double border.</p>` },
   { id: 'search', h: '4. Searching and bringing nodes onto the graph', body: `
<p>Type at least three characters in <b>Search node</b>: the list shows the nodes containing the text in their name, aliases, notes and record values. Clicking a result brings the node onto the graph and centres it. <b>Add all results</b> brings them all at once; <b>Load all targets</b> adds the targets of the case.</p>
${fig(IMG.search, 'Search results with the node type and a tick for those already on the graph.')}
<p>With <b>Fuzzy search</b> nearby spellings are found too (typos, different transliterations); the level from 1 to 6 sets how many differences to tolerate. <b>Clear graph</b> removes every node from view without deleting anything.</p>` },
   { id: 'graph', h: '5. Moving around the graph', body: `
<p>Drag the background to pan and use the wheel to zoom. <b>Fit</b> brings everything back into the window. A <b>click on a node</b> expands it, showing the connected nodes within the depth chosen in <b>Depth</b> (1 = direct neighbours only); a <b>second click</b> collapses it, hiding the neighbours that were visible because of it (those connected to other expanded or selected nodes stay). <b>Expand all</b> and <b>Collapse</b> act on every visible node.</p>
<p><b>Right-click</b> on a node opens its card; on a connection it opens the connection window; on the background it opens a menu with <b>New node</b>.</p>
${fig(IMG.ctx, 'Right-click on the background: context menu.')}
<p>With <kbd>Ctrl</kbd>+click (or <kbd>Ctrl</kbd>+dragging a box) you build a <b>selection</b> of nodes, listed in the <b>Selection</b> box: from there you highlight all paths between the chosen nodes (within a maximum number of hops) and create connections between them. <kbd>H</kbd>+click highlights a node and its connections while dimming the rest; <kbd>N</kbd>+click hides a node (the <b>Show hidden</b> button brings them back). <kbd>Alt</kbd>+click on a social profile opens it in the browser according to the choice in <b>Alt+Click on social</b>.</p>
<p><b>Show nodes with</b> filters the graph by minimum number of connections: useful to bring out the most connected nodes.</p>` },
   { id: 'card', h: '6. The node card', body: `
<p>The card (right-click on the node) gathers everything known about that node: the user's <b>note</b>, the <b>summary of connections</b> grouped by category (social by platform, then phones, emails, places, vehicles…), the <b>records</b> with raw data and images. Every value is copied to the clipboard with one click; the names of connected nodes are clickable and lead to the node.</p>
${fig(IMG.card, 'Card of the target with note, summary of connections and buttons at the bottom.')}
<p>The buttons at the bottom: <b>Expand branch / Collapse</b>, <b>Centre in graph</b>, <b>Search in sources</b> (the card's terms in the indexed documents), <b>Add</b> (a new node connected to this one), <b>Import with AI</b> (free text interpreted by the AI), <b>Rename</b>, <b>Edit values</b>, <b>Note</b>, <b>PDF</b> (the printable card) and <b>Delete node</b>. A deleted data node goes to <b>Deleted nodes</b>, from where it can be restored; a hand-made node is really deleted.</p>` },
   { id: 'add', h: '7. Adding a node', body: `
<p><b>New node</b> in the panel (or in the background right-click menu) creates a standalone node; <b>Add</b> in a node's card creates a node already connected to it. Choose the <b>type</b> and fill in its fields: profile URL for social accounts (the platform is recognised from the address), number, email, username, surname, first name and date of birth for people, city, address, house number and coordinates for places, plate and colour for vehicles, title and text for notes, image for photos, plus the investigative items (weapons, drugs, documents…).</p>
${fig(IMG.add, 'New node connected to a target: type, value, target flag, connection properties and preview.')}
<p>Any node can be highlighted as a <b>target</b> with the <b>Highlight as target</b> box. If the node is born connected to another, the <b>connection properties</b> are at the bottom: name, line shape, line style, width and colour. <b>Arrows</b> are set directly on the <b>preview</b>: a click next to a node adds or removes the arrowhead towards that node (a translucent head appears on hover).</p>
<p>The <b>✨ AI</b> button at the top of the window switches to free-text mode: paste a text (a report, a tip, a message) and the AI proposes people, phones, emails, profiles, places and vehicles with their relations; you check them in a preview before creating them.</p>` },
   { id: 'links', h: '8. Connections', body: `
<p>To connect existing nodes: select them with <kbd>Ctrl</kbd>+click and press <b>Connect selected nodes</b>. With two nodes you choose the direction (the ⇄ button swaps them); with more nodes every pair is connected. Several connections may exist between two nodes, each with its own name.</p>
${fig(IMG.link, 'Connect nodes: name, shape, line, width, colour and arrows from the preview (here in both directions).')}
<p><b>Right-click on a connection</b> opens its window: change name and appearance, swap the arrows, move to the other connections between the same nodes, create another one, and delete hand-made connections. For connections coming from the data only the appearance changes; <b>Default style</b> restores it.</p>
${fig(IMG.edge, 'Editing a connection: red dashed curved arc with arrows in both directions.')}
<p>In the panel, <b>Connection style</b> applies shape, line style and width to <b>all</b> connections of the graph at once; it is a display preference that does not change the data and is undone by choosing “as set”.</p>` },
   { id: 'edit', h: '9. Editing a node\'s values', body: `
<p>From the card, <b>Edit values</b> opens all the node's data: label, URL (opened with Alt+click), note, the <b>Highlight as target</b> box and the fields of every record. Values can be changed or marked as deleted with ✕; free fields can be added. Changes never touch the source files: they stay in the case and are applied on the fly. <b>Undo all changes</b> brings the node back to the original data.</p>
${fig(IMG.edit, 'Edit values: general fields, target flag and record fields (including those imported from a CSV).')}` },
   { id: 'import', h: '10. Importing from CSV or Excel', body: `
<p><b>Import CSV/Excel</b> creates many nodes and connections at once, in three steps. The file has one row per connection: node 1, connection, node 2; without node 2 a standalone node is created.</p>
${fig(IMG.imp1, 'Step 1: the file. “Download a sample file” produces a pre-filled template.')}
<p>In <b>step 2</b> every column of the file appears with a few sample values and an <b>Import as</b> drop-down. Columns with recognised headers are already assigned; the others are proposed as <b>extra field of node 1</b>, so they end up in the node's record under the column name and no value is lost. You can set a default type for nodes without a type column, a default connection name and whether the first row holds the headers.</p>
${fig(IMG.imp2, 'Step 2: column mapping.')}
<p><b>Step 3</b> shows what will be created row by row: new nodes, existing nodes (in italics), connections and any errors. Rows can be excluded one by one; then <b>Import</b>.</p>
${fig(IMG.imp3, 'Step 3: preview and import.')}
<h3>Recognised headers</h3>
<table>
<tr><th>Data</th><th>Headers (English / Italian), with 1 or 2 for the side</th></tr>
<tr><td>Node name or value</td><td>name, name1, name2, nome, value, valore, from/to, da/a</td></tr>
<tr><td>Type</td><td>type, tipo (person, phone, email, username, social or directly instagram/facebook/…, link, place, vehicle, text, target)</td></tr>
<tr><td>Other node data</td><td>label, url, platform, text, surname, birthdate, color (vehicle), target (yes/no), address, housenumber, lat, lon, note</td></tr>
<tr><td>Connection</td><td>relation, arrow (-> &lt;- &lt;-&gt;), shape (straight, curve, segments, right angle, wedge), color, line (solid, dashed, dotted), width</td></tr>
</table>
<div class="note warn">A person is identified by <b>name and date of birth together</b>: if the date appears only in some rows, “John Smith (12/03/1980)” and “John Smith” become two distinct nodes joined by a dashed line. Repeat the date on every row of the same person. Two complete sample files are in the program's <code>esempi</code> folder.</div>` },
   { id: 'filters', h: '11. Categories, layout and appearance', body: `
<p>The <b>Categories</b> buttons switch whole categories of nodes off and on (phones, social, places…), each in the category colour with its count; <b>Hide all / Show all</b> acts on all of them. An explicit action (expansion, addition) makes the involved nodes visible again anyway.</p>
<p><b>Layout</b>: <b>Organic</b> arranges nodes by force (connected ones close together), <b>Circular</b> in a circle, <b>Hierarchical</b> as a tree, <b>Grid</b> in rows and columns; <b>Reduce crossings</b> rearranges the current graph to lower the number of crossings. Expanding a node places only the new nodes in a ring around it, without moving the others or the camera.</p>
<p><b>Identifiers</b> shows or hides the identifier nodes (phones, emails, usernames) used as bridges between people. The <b>legend</b> at the bottom of the panel shows the colours of the categories present.</p>` },
   { id: 'views', h: '12. Saved views', body: `
<p>A <b>view</b> is a snapshot of the graph as it is now: visible and expanded nodes, positions, zoom and selection. Type a name and press <b>Save view</b>; the drop-down lists the case's views, <b>Open</b> restores one and 🗑 deletes it. Views are useful to resume a line of reasoning or to prepare the screen to export.</p>` },
   { id: 'sources', h: '13. Document sources and OCR', body: `
<p>Put the documents (PDF, Word, Excel, CSV, text, images) in the <code>fonti</code> folder next to the program and press <b>Scan</b>: their content is indexed inside the program. From then on <b>Search in sources</b>, in the panel or in a node's card, finds in which documents a term or the node's values (numbers, names, emails) appear, with the context snippet and a link to open the file.</p>
<p><b>Images</b> (photos of documents, screenshots) are read with Tesseract <b>OCR</b>. If the status line says “OCR not available”, on Windows the <b>Download Tesseract (OCR)</b> button is enough: the program downloads the official installer (about 50 MB), extracts it into the <code>tools/tesseract</code> folder next to the program and enables OCR without restarting. On Linux and Mac install Tesseract from the package manager.</p>` },
   { id: 'ai', h: '14. Artificial intelligence', body: `
<p>The program can use a <b>chatbot</b> (an Ollama-compatible server or one with an OpenAI API, local or remote) for two things: <b>creating nodes from free text</b> and <b>transliterating</b> into Latin characters the names written in other alphabets. The AI is optional: with the <b>AI active</b> switch off the program connects to nothing and uses only local transliteration.</p>
${fig(IMG.ai, 'AI configuration: endpoint, key, model, API format, timeout and automatic transliteration.')}
<p><b>Configure</b> opens the settings: server address, API key (saved in the <code>chatbot.conf</code> file next to the program, never publish it), model, request format, maximum waiting time, key header and prefix. <b>Test connection</b> checks that the server answers. The <b>Transliterate with AI</b> button appears in the panel when there are words to transliterate.</p>
<div class="note warn">The texts you paste in AI mode and the names to transliterate are sent to the server you configured. Use a server you trust, or a local one, if the data is confidential.</div>` },
   { id: 'manual', h: '15. Manual changes and deleted nodes', body: `
<p><b>Manual changes</b> lists everything created or changed by hand in the case: added nodes (including those imported from files or proposed by the AI), created connections and renamed labels, with a name filter. From here you delete what is no longer needed. <b>Deleted nodes</b> lists the data nodes removed from the graph and lets you restore them one by one or all together.</p>
${fig(IMG.manual, 'Manual changes: hand-added nodes with date and connections.')}` },
   { id: 'export', h: '16. Exporting', body: `
<p><b>Graph to PDF</b> prints the graph as shown on screen, with legend and case header. <b>Table sheet</b> produces a document with all visible nodes and their data in a table, ready to print or save as PDF from the browser. From a node's card, <b>PDF</b> exports that single card. The sample CSV is downloaded from the import window.</p>` },
   { id: 'lang', h: '17. Languages, licenses and credits', body: `
<p>The interface language is chosen from the drop-down next to the logo (Italian, English, French, German, Spanish, Arabic with right-to-left text); data content is not translated. Under the logo are the author's credits and the <b>Licenses</b> link, which lists the program and all third-party components with the full license texts.</p>
${fig(IMG.lic, 'Licenses window: components on the left, text on the right.')}` },
   { id: 'files', h: '18. Data, folders and files', body: `
<table>
<tr><th>Folder / file</th><th>Content</th></tr>
<tr><td><code>data/</code></td><td>All data: the general archive (cases, transliteration dictionary, sources index) and the <code>cases</code> folder with one database per case. Keep a copy as a backup.</td></tr>
<tr><td><code>data/media/</code></td><td>Images uploaded into photo nodes.</td></tr>
<tr><td><code>fonti/</code></td><td>Documents to index for the search in sources.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>AI configuration with the server key: do not share it. <code>chatbot.conf.example</code> is the empty template.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Tesseract OCR downloaded by the program.</td></tr>
<tr><td><code>esempi/</code></td><td>Sample CSV files for the import.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>Program license, additional terms and component licenses.</td></tr>
</table>
<p>The program is portable: the folder can be copied to another PC with all its data. For a backup it is enough to copy the <code>data</code> folder (and <code>fonti</code>, if needed).</p>` },
  ]
};

M.fr = {
  title: 'Manuel d\'utilisation', sub: 'PolGraph OSINT · exploration graphique de données OSINT pour les dossiers d\'enquête',
  toc: 'Sommaire', shortcuts: 'Raccourcis souris et clavier',
  kbdHead: ['Action', 'Effet'],
  kbd: [
    ['Clic sur un nœud', 'Développe le nœud (affiche ses liaisons) ; un second clic le replie'],
    ['Clic droit sur un nœud', 'Ouvre la fiche du nœud'],
    ['Clic droit sur une liaison', 'Ouvre la fenêtre de modification de la liaison'],
    ['Clic droit sur le fond', 'Menu contextuel avec « Nouveau nœud »'],
    ['Ctrl+clic (ou ⌘+clic) sur un nœud', 'Ajoute le nœud à la sélection ou l\'en retire'],
    ['Ctrl+glisser sur le fond', 'Rectangle de sélection : les nœuds inclus s\'ajoutent à la sélection'],
    ['Alt+clic sur un nœud social', 'Ouvre le profil (fenêtre côte à côte, onglet d\'arrière-plan ou copie du lien, selon le choix dans le panneau)'],
    ['H+clic sur un nœud', 'Met en évidence le nœud et ses liaisons en atténuant le reste ; à nouveau pour annuler'],
    ['N+clic sur un nœud', 'Masque le nœud (affichage seulement, les données restent)'],
    ['Molette / glisser', 'Zoom et déplacement du graphe'],
    ['Échap', 'Ferme la fenêtre ouverte'],
    ['Entrée dans le champ nom d\'une liaison', 'Enregistre'],
    ['Barre de titre d\'une fenêtre', 'Glisser pour déplacer la fenêtre ; double-clic pour la recentrer'],
  ],
  sections: [
   { id: 'intro', h: '1. Qu\'est-ce qu\'PolGraph OSINT', body: `
<p>PolGraph OSINT représente sous forme de <b>graphe</b> les informations d'un dossier d'enquête : personnes, téléphones, e-mails, profils sociaux, véhicules, lieux, documents et les liaisons entre eux. Chaque élément est un <b>nœud</b>, chaque relation une <b>liaison</b>. Le programme tourne sur votre ordinateur : les données ne quittent jamais le PC, sauf pour le service d'intelligence artificielle facultatif que vous configurez vous-même.</p>
<p>Lancez-le par un double-clic sur l'exécutable (ou, depuis le code source, avec <code>python app.py</code>) : un petit serveur local démarre et le navigateur s'ouvre à l'adresse <code>http://127.0.0.1:5000</code>. La fenêtre de console affiche les messages du programme et sert à l'arrêter (<kbd>Ctrl</kbd>+<kbd>C</kbd> ou fermeture de la fenêtre). Le port se change avec la variable d'environnement <code>PORT</code>.</p>
<div class="note">Le programme est un logiciel libre (GNU GPL v3 avec obligation d'attribution). Les licences du programme et de tous ses composants se lisent depuis le lien <b>Licences</b> du panneau de gauche.</div>` },
   { id: 'cases', h: '2. Dossiers : premier démarrage et gestion', body: `
<p>Tout le travail est organisé en <b>dossiers</b>. Chaque dossier est une archive séparée avec ses propres nœuds, liaisons, notes, vues et fichiers importés. Au premier démarrage il n'existe aucun dossier : le programme demande aussitôt d'en créer un, et tant qu'aucun dossier n'est ouvert on ne peut ni ajouter de nœuds ni importer de données.</p>
${fig(IMG.first, 'Premier démarrage : aucun dossier ouvert, la fenêtre « Nouveau dossier » s\'ouvre d\'elle-même.')}
<p>Dans le cadre <b>Dossier</b> en haut du panneau :</p>
<ul>
<li>la <b>liste déroulante</b> montre le dossier ouvert ; en choisir un autre recharge la page avec ses données ;</li>
<li><b>Nouveau</b> crée un dossier vide et l'ouvre ; <b>Modifier</b> change le nom et la description ;</li>
<li><b>Fusionner</b> crée un nouveau dossier avec le contenu de deux dossiers ou plus : les nœuds identiques (même personne, même téléphone…) n'en font plus qu'un et les données différentes restent des fiches distinctes du même nœud ; au choix, les dossiers d'origine sont supprimés ;</li>
<li><b>Supprimer</b> efface le dossier avec tout son contenu. L'opération est irréversible : si c'était le dernier dossier, on revient à l'état initial sans dossier.</li>
</ul>
${fig(IMG.caseEdit, 'Modification du nom et de la description du dossier.')}` },
   { id: 'interface', h: '3. L\'interface', body: `
<p>À gauche le <b>panneau de commandes</b>, à droite le <b>graphe</b> sur fond blanc. Le panneau défile verticalement et contient, de haut en bas : logo et crédits, le dossier, la recherche, les boutons principaux, l'intelligence artificielle, les vues enregistrées, les sources documentaires, les filtres par catégorie, les options des liaisons et de la disposition, l'export, la sélection, la légende et la ligne d'état.</p>
${fig(IMG.over, 'Vue d\'ensemble : panneau à gauche, graphe à droite. Le nœud doré est la cible, les lignes rouges en pointillé sont des liaisons personnalisées.')}
<div class="two">
${fig(IMG.sideTop, 'Partie haute du panneau.', 'narrow')}
${fig(IMG.sideBottom, 'Partie basse du panneau : disposition, export, sélection, légende.', 'narrow')}
</div>
<p>Les nœuds ont une icône et une couleur par type (personne, téléphone, e-mail, social avec le logo de la plateforme, véhicule, lieu, lien, texte, photo). La <b>cible</b> est plus grande, avec bordure et nom dorés. Les nœuds issus des données de départ ont une bordure rouge. Un nœud développé a une bordure double.</p>` },
   { id: 'search', h: '4. Rechercher et amener des nœuds sur le graphe', body: `
<p>Tapez au moins trois caractères dans <b>Rechercher un nœud</b> : la liste montre les nœuds contenant le texte dans leur nom, leurs alias, leurs notes et les valeurs de leurs fiches. Un clic sur un résultat amène le nœud sur le graphe et le centre. <b>Ajouter tous les résultats</b> les amène tous ensemble ; <b>Charger toutes les cibles</b> ajoute les cibles du dossier.</p>
${fig(IMG.search, 'Résultats de recherche avec le type du nœud et une coche pour ceux déjà sur le graphe.')}
<p>Avec la <b>recherche approximative</b> on trouve aussi les graphies proches (fautes de frappe, translittérations différentes) ; le niveau de 1 à 6 indique combien de différences tolérer. <b>Vider le graphe</b> retire tous les nœuds de la vue sans rien supprimer.</p>` },
   { id: 'graph', h: '5. Se déplacer dans le graphe', body: `
<p>Glissez le fond pour déplacer le graphe et utilisez la molette pour zoomer. <b>Ajuster</b> ramène tout dans la fenêtre. Un <b>clic sur un nœud</b> le développe, montrant les nœuds reliés dans la profondeur choisie dans <b>Prof.</b> (1 = voisins directs seulement) ; un <b>second clic</b> le replie, masquant les voisins visibles grâce à lui (ceux reliés à d'autres nœuds développés ou sélectionnés restent). <b>Tout développer</b> et <b>Replier</b> agissent sur tous les nœuds visibles.</p>
<p>Le <b>clic droit</b> sur un nœud ouvre sa fiche ; sur une liaison il ouvre la fenêtre de la liaison ; sur le fond il ouvre un menu avec <b>Nouveau nœud</b>.</p>
${fig(IMG.ctx, 'Clic droit sur le fond : menu contextuel.')}
<p>Avec <kbd>Ctrl</kbd>+clic (ou <kbd>Ctrl</kbd>+glisser un rectangle) on construit une <b>sélection</b> de nœuds, listée dans le cadre <b>Sélection</b> : de là on met en évidence tous les chemins entre les nœuds choisis (dans un nombre maximal de sauts) et on crée des liaisons entre eux. <kbd>H</kbd>+clic met en évidence un nœud et ses liaisons en atténuant le reste ; <kbd>N</kbd>+clic masque un nœud (le bouton <b>Afficher les masqués</b> les fait réapparaître). <kbd>Alt</kbd>+clic sur un profil social l'ouvre dans le navigateur selon le choix de <b>Alt+clic sur les réseaux sociaux</b>.</p>
<p><b>Afficher les nœuds avec</b> filtre le graphe par nombre minimal de liaisons : utile pour faire ressortir les nœuds les plus connectés.</p>` },
   { id: 'card', h: '6. La fiche du nœud', body: `
<p>La fiche (clic droit sur le nœud) réunit tout ce que l'on sait de ce nœud : la <b>note</b> de l'utilisateur, le <b>résumé des liaisons</b> groupées par catégorie (réseaux sociaux par plateforme, puis téléphones, e-mails, lieux, véhicules…), les <b>fiches</b> avec les données brutes et les images. Chaque valeur se copie dans le presse-papiers d'un clic ; les noms des nœuds reliés sont cliquables et mènent au nœud.</p>
${fig(IMG.card, 'Fiche de la cible avec note, résumé des liaisons et boutons en bas.')}
<p>Les boutons du bas : <b>Développer la branche / Replier</b>, <b>Centrer dans le graphe</b>, <b>Chercher dans les sources</b> (les termes de la fiche dans les documents indexés), <b>Ajouter</b> (un nouveau nœud relié à celui-ci), <b>Importer avec l'IA</b> (texte libre interprété par l'IA), <b>Renommer</b>, <b>Modifier les valeurs</b>, <b>Note</b>, <b>PDF</b> (la fiche imprimable) et <b>Supprimer le nœud</b>. Un nœud des données supprimé passe dans les <b>Nœuds supprimés</b>, d'où il peut être restauré ; un nœud créé à la main est réellement supprimé.</p>` },
   { id: 'add', h: '7. Ajouter un nœud', body: `
<p><b>Nouveau nœud</b> dans le panneau (ou dans le menu du clic droit sur le fond) crée un nœud indépendant ; <b>Ajouter</b> dans la fiche d'un nœud crée un nœud déjà relié à celui-ci. On choisit le <b>type</b> et on remplit ses champs : URL du profil pour les réseaux sociaux (la plateforme est reconnue d'après l'adresse), numéro, e-mail, nom d'utilisateur, nom, prénom et date de naissance pour les personnes, ville, adresse, numéro et coordonnées pour les lieux, plaque et couleur pour les véhicules, titre et texte pour les notes, image pour les photos, plus les éléments d'enquête (armes, stupéfiants, documents…).</p>
${fig(IMG.add, 'Nouveau nœud relié à une cible : type, valeur, case cible, propriétés de la liaison et aperçu.')}
<p>N'importe quel nœud peut être mis en évidence comme <b>cible</b> avec la case <b>Marquer comme cible</b>. Si le nœud naît relié à un autre, les <b>propriétés de la liaison</b> sont en bas : nom, forme de la ligne, type de ligne, épaisseur et couleur. Les <b>flèches</b> se règlent directement sur l'<b>aperçu</b> : un clic près d'un nœud ajoute ou retire la pointe de flèche vers ce nœud (une pointe translucide apparaît au survol).</p>
<p>Le bouton <b>✨ IA</b> en haut de la fenêtre passe en mode texte libre : collez un texte (procès-verbal, signalement, message) et l'IA propose personnes, téléphones, e-mails, profils, lieux et véhicules avec leurs relations ; vous les vérifiez dans un aperçu avant de les créer.</p>` },
   { id: 'links', h: '8. Liaisons', body: `
<p>Pour relier des nœuds déjà présents : sélectionnez-les avec <kbd>Ctrl</kbd>+clic et appuyez sur <b>Relier les nœuds sélectionnés</b>. Avec deux nœuds on choisit le sens (le bouton ⇄ les échange) ; avec davantage, toutes les paires sont reliées. Plusieurs liaisons peuvent exister entre deux nœuds, chacune avec son nom.</p>
${fig(IMG.link, 'Relier des nœuds : nom, forme, ligne, épaisseur, couleur et flèches depuis l\'aperçu (ici dans les deux sens).')}
<p>Le <b>clic droit sur une liaison</b> ouvre sa fenêtre : on modifie le nom et l'aspect, on inverse les flèches, on passe aux autres liaisons entre les mêmes nœuds, on en crée une autre, et on supprime les liaisons créées à la main. Pour les liaisons issues des données, seul l'aspect change ; <b>Style par défaut</b> le rétablit.</p>
${fig(IMG.edge, 'Modification d\'une liaison : arc courbe rouge en pointillé avec flèches dans les deux sens.')}
<p>Dans le panneau, <b>Style des liaisons</b> applique forme, type de ligne et épaisseur à <b>toutes</b> les liaisons du graphe en même temps ; c'est une préférence d'affichage qui ne modifie pas les données et s'annule en choisissant « comme définies ».</p>` },
   { id: 'edit', h: '9. Modifier les valeurs d\'un nœud', body: `
<p>Depuis la fiche, <b>Modifier les valeurs</b> ouvre toutes les données du nœud : libellé, URL (ouverte par Alt+clic), note, la case <b>Marquer comme cible</b> et les champs de chaque fiche. Les valeurs se changent ou se marquent comme supprimées avec ✕ ; on peut ajouter des champs libres. Les modifications ne touchent jamais les fichiers d'origine : elles restent dans le dossier et s'appliquent à la volée. <b>Annuler toutes les modifications</b> ramène le nœud aux données d'origine.</p>
${fig(IMG.edit, 'Modifier les valeurs : champs généraux, case cible et champs de la fiche (y compris ceux importés d\'un CSV).')}` },
   { id: 'import', h: '10. Importer depuis CSV ou Excel', body: `
<p><b>Importer CSV/Excel</b> crée de nombreux nœuds et liaisons en une fois, en trois étapes. Le fichier a une ligne par liaison : nœud 1, liaison, nœud 2 ; sans nœud 2 un nœud isolé est créé.</p>
${fig(IMG.imp1, 'Étape 1 : le fichier. « Télécharger un fichier d\'exemple » produit un modèle déjà rempli.')}
<p>À l'<b>étape 2</b>, chaque colonne du fichier apparaît avec quelques valeurs d'exemple et une liste <b>Importer comme</b>. Les colonnes aux en-têtes reconnus sont déjà attribuées ; les autres sont proposées comme <b>champ supplémentaire du nœud 1</b>, de sorte qu'elles vont dans la fiche du nœud sous le nom de la colonne et qu'aucune valeur n'est perdue. On peut indiquer un type par défaut pour les nœuds sans colonne type, un nom par défaut pour la liaison et si la première ligne contient les en-têtes.</p>
${fig(IMG.imp2, 'Étape 2 : correspondance des colonnes.')}
<p>L'<b>étape 3</b> montre ce qui sera créé ligne par ligne : nouveaux nœuds, nœuds déjà présents (en italique), liaisons et erreurs éventuelles. Les lignes peuvent être exclues une à une ; puis <b>Importer</b>.</p>
${fig(IMG.imp3, 'Étape 3 : aperçu et importation.')}
<h3>En-têtes reconnus</h3>
<table>
<tr><th>Donnée</th><th>En-têtes (anglais / italien), avec 1 ou 2 pour le côté</th></tr>
<tr><td>Nom ou valeur du nœud</td><td>name, name1, name2, nome, value, valore, from/to, da/a</td></tr>
<tr><td>Type</td><td>type, tipo (person, phone, email, username, social ou directement instagram/facebook/…, link, place, vehicle, text, target)</td></tr>
<tr><td>Autres données du nœud</td><td>label, url, platform, text, surname, birthdate, color (véhicule), target (oui/non), address, housenumber, lat, lon, note</td></tr>
<tr><td>Liaison</td><td>relation, arrow (-> &lt;- &lt;-&gt;), shape (straight, curve, segments, right angle, wedge), color, line (solid, dashed, dotted), width</td></tr>
</table>
<div class="note warn">Une personne est identifiée par <b>le nom et la date de naissance ensemble</b> : si la date n'apparaît que sur certaines lignes, « Rossi Mario (12/03/1980) » et « Rossi Mario » deviennent deux nœuds distincts reliés par un pointillé. Répétez la date sur chaque ligne de la même personne. Deux fichiers d'exemple complets se trouvent dans le dossier <code>esempi</code> du programme.</div>` },
   { id: 'filters', h: '11. Catégories, disposition et aspect', body: `
<p>Les boutons <b>Catégories</b> éteignent ou rallument des catégories entières de nœuds (téléphones, réseaux sociaux, lieux…), chacun dans la couleur de la catégorie avec son nombre ; <b>Tout masquer / Tout afficher</b> agit sur toutes. Une action explicite (développement, ajout) rend quand même visibles les nœuds concernés.</p>
<p><b>Disposition</b> : <b>Organique</b> place les nœuds par forces (les reliés proches), <b>Circulaire</b> en cercle, <b>Hiérarchique</b> en arbre, <b>Grille</b> en lignes et colonnes ; <b>Réduire les croisements</b> réordonne le graphe actuel pour diminuer les croisements. Le développement d'un nœud place seulement les nouveaux nœuds en couronne autour de lui, sans déplacer les autres ni la caméra.</p>
<p><b>Identifiants</b> affiche ou masque les nœuds identifiants (téléphones, e-mails, noms d'utilisateur) servant de pont entre personnes. La <b>légende</b> en bas du panneau donne les couleurs des catégories présentes.</p>` },
   { id: 'views', h: '12. Vues enregistrées', body: `
<p>Une <b>vue</b> est l'instantané du graphe tel qu'il est : nœuds visibles et développés, positions, zoom et sélection. Tapez un nom et appuyez sur <b>Enregistrer la vue</b> ; la liste présente les vues du dossier, <b>Ouvrir</b> en restaure une et 🗑 la supprime. Les vues servent à reprendre un raisonnement ou à préparer l'écran à exporter.</p>` },
   { id: 'sources', h: '13. Sources documentaires et OCR', body: `
<p>Placez les documents (PDF, Word, Excel, CSV, texte, images) dans le dossier <code>fonti</code> à côté du programme et appuyez sur <b>Analyser</b> : leur contenu est indexé dans le programme. Dès lors, <b>Chercher dans les sources</b>, dans le panneau ou dans la fiche d'un nœud, trouve dans quels documents apparaissent un terme ou les valeurs du nœud (numéros, noms, e-mails), avec l'extrait de contexte et le lien pour ouvrir le fichier.</p>
<p>Les <b>images</b> (photos de documents, captures d'écran) sont lues avec l'<b>OCR</b> Tesseract. Si la ligne d'état indique « OCR non disponible », sous Windows le bouton <b>Télécharger Tesseract (OCR)</b> suffit : le programme télécharge l'installateur officiel (environ 50 Mo), l'extrait dans le dossier <code>tools/tesseract</code> à côté du programme et active l'OCR sans redémarrer. Sous Linux et Mac, installez Tesseract avec le gestionnaire de paquets.</p>` },
   { id: 'ai', h: '14. Intelligence artificielle', body: `
<p>Le programme peut utiliser un <b>chatbot</b> (serveur compatible Ollama ou à API OpenAI, local ou distant) pour deux choses : <b>créer des nœuds à partir d'un texte libre</b> et <b>translittérer</b> en caractères latins les noms écrits dans d'autres alphabets. L'IA est facultative : avec l'interrupteur <b>IA active</b> éteint, le programme ne se connecte à rien et n'utilise que la translittération locale.</p>
${fig(IMG.ai, 'Configuration de l\'IA : point d\'accès, clé, modèle, format d\'API, délai et translittération automatique.')}
<p><b>Configurer</b> ouvre les réglages : adresse du serveur, clé API (enregistrée dans le fichier <code>chatbot.conf</code> à côté du programme, à ne jamais publier), modèle, format des requêtes, délai maximal, en-tête et préfixe de la clé. <b>Tester la connexion</b> vérifie que le serveur répond. Le bouton <b>Translittérer avec l'IA</b> apparaît dans le panneau quand il y a des mots à translittérer.</p>
<div class="note warn">Les textes collés en mode IA et les noms à translittérer sont envoyés au serveur que vous avez configuré. Utilisez un serveur de confiance, ou local, si les données sont confidentielles.</div>` },
   { id: 'manual', h: '15. Modifications manuelles et nœuds supprimés', body: `
<p><b>Modifications manuelles</b> liste tout ce qui a été créé ou changé à la main dans le dossier : nœuds ajoutés (y compris ceux importés depuis des fichiers ou proposés par l'IA), liaisons créées et libellés renommés, avec un filtre par nom. De là on supprime ce qui ne sert plus. <b>Nœuds supprimés</b> liste les nœuds des données retirés du graphe et permet de les restaurer un à un ou tous ensemble.</p>
${fig(IMG.manual, 'Modifications manuelles : nœuds ajoutés à la main avec date et liaisons.')}` },
   { id: 'export', h: '16. Exporter', body: `
<p><b>Graphe en PDF</b> imprime le graphe tel qu'affiché, avec légende et en-tête du dossier. <b>Fiche tabulaire</b> produit un document avec tous les nœuds visibles et leurs données, en tableau, prêt à imprimer ou à enregistrer en PDF depuis le navigateur. Depuis la fiche d'un nœud, <b>PDF</b> exporte cette seule fiche. Le CSV d'exemple se télécharge depuis la fenêtre d'importation.</p>` },
   { id: 'lang', h: '17. Langues, licences et crédits', body: `
<p>La langue de l'interface se choisit dans la liste à côté du logo (italien, anglais, français, allemand, espagnol, arabe avec texte de droite à gauche) ; le contenu des données n'est pas traduit. Sous le logo se trouvent les crédits de l'auteur et le lien <b>Licences</b>, qui liste le programme et tous les composants tiers avec le texte complet des licences.</p>
${fig(IMG.lic, 'Fenêtre des licences : composants à gauche, texte à droite.')}` },
   { id: 'files', h: '18. Données, dossiers et fichiers', body: `
<table>
<tr><th>Dossier / fichier</th><th>Contenu</th></tr>
<tr><td><code>data/</code></td><td>Toutes les données : l'archive générale (dossiers, dictionnaire de translittération, index des sources) et le dossier <code>cases</code> avec une base par dossier d'enquête. Gardez-en une copie de sauvegarde.</td></tr>
<tr><td><code>data/media/</code></td><td>Les images chargées dans les nœuds photo.</td></tr>
<tr><td><code>fonti/</code></td><td>Les documents à indexer pour la recherche dans les sources.</td></tr>
<tr><td><code>chatbot.conf</code></td><td>Configuration de l'IA avec la clé du serveur : à ne pas partager. <code>chatbot.conf.example</code> est le modèle vide.</td></tr>
<tr><td><code>tools/tesseract/</code></td><td>Tesseract OCR téléchargé par le programme.</td></tr>
<tr><td><code>esempi/</code></td><td>Fichiers CSV d'exemple pour l'importation.</td></tr>
<tr><td><code>LICENSE</code>, <code>NOTICE</code>, <code>THIRD-PARTY-NOTICES.md</code></td><td>Licence du programme, termes additionnels et licences des composants.</td></tr>
</table>
<p>Le programme est portable : le dossier peut être copié sur un autre PC avec toutes ses données. Pour une sauvegarde il suffit de copier le dossier <code>data</code> (et <code>fonti</code>, si besoin).</p>` },
  ]
};
